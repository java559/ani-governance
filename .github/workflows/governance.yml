name: ANI Governance CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly -p=2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare private tool directory
        run: |
          set -eu
          echo "GOBIN=$RUNNER_TEMP/ani-bin" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ani-bin" >> "$GITHUB_PATH"
          echo "ANI_CI_EVIDENCE_ROOT=$RUNNER_TEMP/ani-evidence-checks" >> "$GITHUB_ENV"
          echo "ANI_CI_RAW_EVIDENCE_ROOT=$RUNNER_TEMP/ani-evidence-raw-checks" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ani-evidence-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/ani-evidence-checks/source.sha"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ani-evidence-checks/checkout.tree"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/ani-evidence-checks/pr-head.sha"
          echo not_started > "$RUNNER_TEMP/ani-evidence-checks/job-status.txt"
      - name: Install pinned scanners
        run: bash scripts/ci/install-tools.sh scanners
      - name: checks
        run: bash scripts/ci/run-with-evidence.sh checks -- make check
      - name: Upload redacted checks evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ani-evidence-checks
          if-no-files-found: error
          retention-days: 30

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly -p=2'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      ANI_TEST_DATABASE_DSN: postgres://gov_acc_runtime@127.0.0.1:5432/gov_acc_data?sslmode=disable
      ANI_TEST_GUARD_DATABASE_DSN: postgres://gov_acc_runtime@127.0.0.1:5432/gov_acc_guard?sslmode=disable
      ANI_TEST_RACE_DATA_DSN: postgres://gov_acc_runtime@127.0.0.1:5432/gov_acc_race_data?sslmode=disable
      ANI_TEST_RACE_SERVICE_DSN: postgres://gov_acc_runtime@127.0.0.1:5432/gov_acc_race_service?sslmode=disable
      ANI_TEST_DATABASE_EXCLUSIVE: '1'
      ANI_TEST_GUARD_DATABASE_EXCLUSIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare temporary directory
        run: |
          set -eu
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "ANI_CI_EVIDENCE_ROOT=$RUNNER_TEMP/ani-evidence-integration" >> "$GITHUB_ENV"
          echo "ANI_CI_RAW_EVIDENCE_ROOT=$RUNNER_TEMP/ani-evidence-raw-integration" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ani-evidence-integration"
          git rev-parse HEAD > "$RUNNER_TEMP/ani-evidence-integration/source.sha"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ani-evidence-integration/checkout.tree"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/ani-evidence-integration/pr-head.sha"
          echo not_started > "$RUNNER_TEMP/ani-evidence-integration/job-status.txt"
      - name: Migrate isolated PostgreSQL and grant runtime role
        run: bash scripts/ci/setup-postgres.sh
      - name: Build pinned joint service fixtures and provision their isolated database
        env:
          ANI_CI_JOINT_FIXTURE_DIR: ${{ runner.temp }}/ani-joint-fixtures
          ANI_CI_JOINT_ENV_FILE: ${{ runner.temp }}/ani-joint-fixtures.env
        run: |
          bash scripts/ci/setup-joint-fixtures.sh
          cat "$RUNNER_TEMP/ani-joint-fixtures.env" >> "$GITHUB_ENV"
      - name: integration
        run: bash scripts/ci/run-with-evidence.sh integration -- make test-integration
      - name: Upload redacted integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ani-evidence-integration
          if-no-files-found: error
          retention-days: 30

  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly -p=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare private tool directory
        run: |
          set -eu
          echo "GOBIN=$RUNNER_TEMP/ani-bin" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ani-bin" >> "$GITHUB_PATH"
          echo "ANI_CI_EVIDENCE_ROOT=$RUNNER_TEMP/ani-evidence-generation" >> "$GITHUB_ENV"
          echo "ANI_CI_RAW_EVIDENCE_ROOT=$RUNNER_TEMP/ani-evidence-raw-generation" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ani-evidence-generation"
          git rev-parse HEAD > "$RUNNER_TEMP/ani-evidence-generation/source.sha"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ani-evidence-generation/checkout.tree"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/ani-evidence-generation/pr-head.sha"
          echo not_started > "$RUNNER_TEMP/ani-evidence-generation/job-status.txt"
      - name: Install pinned generation tools
        run: bash scripts/ci/install-tools.sh generation
      - name: generation
        run: bash scripts/ci/run-with-evidence.sh generation -- make check-generated
      - name: Upload redacted generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ani-evidence-generation
          if-no-files-found: error
          retention-days: 30
