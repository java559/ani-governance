        get:
            tags:
                - ModelDevService
            operationId: ModelDevService_ListExecutions
            parameters:
                - name: page
                  in: query
                  schema:
                    type: integer
                    format: uint32
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: uint32
                - name: compute_state
                  in: query
                  description: |-
                    以下三个筛选与响应里的 compute_state / delivery_state / close_state 同词汇
                     （不带枚举前缀，如 SUCCEEDED / PUBLISHED / CLOSED）。三者在服务端可叠加，
                     且都在分页前生效，total 为筛选后的条数。
                  schema:
                    type: string
                - name: delivery_state
                  in: query
                  schema:
                    type: string
                - name: close_state
                  in: query
                  schema:
                    type: string
                - name: name
                  in: query
                  description: |-
                    按任务名做不区分大小写的子串匹配，在分页前生效，total 为筛选后的条数。
                     名称即创建时提交的 name，与响应里的 name 同源。
                  schema:
                    type: string
                - name: kind
                  in: query
                  description: |-
                    按任务类型筛选，取值为 GENERAL_TRAINING / FINETUNING，与响应里的 kind 同词汇
                     （不带枚举前缀）。在分页前生效，total 为筛选后的条数。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListExecutionsResponse'
