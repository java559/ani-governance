      description: |-
        Platform user JWT, tenant=0 and precise current Casbin permission are required.
         Only Gov-resolved tenant UUIDs, ACC-managed clusters and historical GPU scopes
         reach Observability. Unknown/duplicate parameters and GET bodies are rejected.
    - name: RoleService
      description: 角色管理服务
    - name: SandboxService
    - name: ServerMonitorService
      description: 服务监控管理服务（只读）
    - name: StorageService
    - name: TaskService
      description: 调度任务管理服务
    - name: TenantService
      description: 租户管理服务
    - name: UserProfileService
      description: 用户个人资料服务
    - name: UserService
      description: 用户管理服务
    - name: VMService
