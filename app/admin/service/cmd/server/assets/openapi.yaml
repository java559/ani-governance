        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        BearerAuth:
            type: http
            description: User JWT
            scheme: bearer
            bearerFormat: JWT
        AccessKeyAuth:
            type: apiKey
            description: Public AK; all three signature headers are required together
            name: X-Access-Key
            in: header
        SignatureAuth:
            type: apiKey
            description: 'ANI-HMAC-SHA256 seven lines: algorithm, uppercase HTTP method, canonical path, canonical query (url.Values.Encode), Access Key, Unix timestamp, lowercase SHA256 of raw request body. HMAC-SHA256 is lowercase hex; all signature headers required, 300-second time window, no Bearer mixing. Supported operations: 24 tenant Network and 11 Image methods only; current API permission and module checks still required. Swagger does not calculate signatures.'
            name: X-Signature
            in: header
        SignatureTime:
            type: apiKey
            description: Positive Unix seconds within 300 seconds of server time
            name: X-Timestamp
            in: header
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /api/v1/auth/password/login
                    refreshUrl: /api/v1/auth/refresh
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: AcceleratorAdminService
      description: |-
        JWT platform user, current role permission and downstream exact actor/action/
         cluster grant are all required. There is no implicit tenant-zero grant.
    - name: AcceleratorService
      description: |-
        JWT tenant user, active tenant, ACCELERATOR plan module, current role
         permission and downstream delegation grant are all required.
    - name: AccessKeyService
      description: OpenAPI 访问凭证（AK/SK）管理 — BFF
    - name: AdminPortalService
      description: 后台前端初始化数据与配置服务
    - name: ApiAuditLogService
      description: API审计日志管理服务
    - name: ApiService
      description: API资源管理服务
    - name: AuthenticationService
      description: |-
        用户后台登录认证服务

         路径规范：本服务的路由统一挂 /api/v1/auth/*，与 ANI Core OpenAPI 契约
         （api/openapi/v1.yaml，servers[0].url = https://{host}/api/v1）拼出的最终 URL 一致。
         仓库内其余服务仍为 /api/v1/admin/*，两套前缀并存，按域逐步迁移。
    - name: ConfigService
      description: 系统参数管理服务
    - name: DashboardService
      description: 后台首页分析概览服务（只读聚合）
    - name: DataAccessAuditLogService
      description: 数据访问审计日志管理服务
    - name: DictEntryService
      description: 数据字典条目管理服务
    - name: DictTypeService
      description: 数据字典分类管理服务
    - name: ImageService
    - name: InferenceService
      description: |-
        Requires trusted tenant-user Principal, active tenant and the separately
         registered INFERENCE module/action/role/plan grants. Accelerator read grants
         cannot admit inference commands. CRUD retains the public data envelope.
    - name: InstanceService
    - name: InternalMessageCategoryService
      description: 站内信消息分类管理服务
    - name: InternalMessageRecipientService
      description: 站内信消息管理服务
    - name: InternalMessageService
      description: 站内信消息管理服务
    - name: LanguageService
      description: 语言管理服务
    - name: LoginAuditLogService
      description: 登录审计日志管理服务
    - name: LoginPolicyService
      description: 登录策略管理服务
    - name: MenuService
      description: 后台菜单管理服务
    - name: MfaService
      description: |-
        MFA（多因素认证）服务 HTTP 桥接。
         管理侧 RPC（GetMFAStatus/ListEnrolledMethods/StartEnrollMethod/ConfirmEnrollMethod/
         DisableMFA/RevokeMFADevice）需登录态，走正常 auth+authz 中间件，不加 security:{}。
         登录挑战侧 RPC（VerifyMFAChallenge）免鉴权，加 security:{} 并加入 rest_server 白名单。
    - name: ModelDevService
      description: CPU-P01 entry in the existing Governance BFF.
    - name: NetworkService
    - name: NotificationChannelService
      description: 通知渠道管理服务（平台级配置）
    - name: OnlineSessionService
      description: 在线会话管理服务（在线用户列表 + 强制下线）
    - name: OperationAuditLogService
      description: 操作审计日志管理服务
    - name: OrgUnitService
      description: 组织单元服务
    - name: PermissionAuditLogService
      description: 权限变更审计日志服务
    - name: PermissionGroupService
      description: 权限组管理服务
    - name: PermissionService
      description: 权限点管理服务
    - name: PlanModuleService
      description: 套餐模块白名单管理服务
    - name: PlanQuotaService
      description: 套餐配额管理服务
    - name: PlanService
      description: 套餐管理服务
    - name: PlatformNetworkService
      description: Platform user JWT, current action permission and Casbin authorization required.
    - name: PolicyEvaluationLogService
      description: 策略评估日志服务
    - name: PositionService
      description: 职位管理服务
    - name: QuotaAdminService
      description: |-
        配额目录与租户账户读取服务（QUOTA-01/02）。
         仅平台管理权限；读取沿用现有分页与成功 JSON 风格，不加全局 code/data envelope。
