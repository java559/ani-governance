                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务超时时间
                deadline:
                    type: string
                    description: 任务截止时间
                    format: date-time
                processIn:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务延迟处理时间
                processAt:
                    type: string
                    description: 任务执行时间点
