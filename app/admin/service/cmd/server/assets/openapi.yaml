        get:
            tags:
                - NetworkService
            summary: List EIPs in the authenticated tenant
            description: Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:eip:list permission. Cursor pagination; limit is 1..100. Only tenant-managed Public EIPs are listed.
            operationId: NetworkService_ListEIPs
            parameters:
                - name: name
                  in: query
                  schema:
                    type: string
                - name: state
                  in: query
                  schema:
                    type: string
                - name: limit
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: cursor
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListEIPsResponse'
                "400":
                    description: Invalid cursor, limit or state filter
                "401":
                    description: Missing, invalid, expired or revoked credentials
                "403":
                    description: Tenant, permission or subscription denied
                "503":
                    description: Network dependency or trusted identity unavailable
                "504":
                    description: Connected Network call timed out
            security:
                - BearerAuth: []
                - AccessKeyAuth: []
                  SignatureAuth: []
                  SignatureTime: []
        post:
            tags:
                - NetworkService
            summary: Allocate a public EIP for the authenticated tenant
            description: Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:eip:create permission. Allocation is asynchronous; retries with the same idempotency_key replay the original result. Only Public addresses are allocatable.
            operationId: NetworkService_CreateEIP
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateEIPRequest'
                required: true
            responses:
                "200":
                    description: Accepted resource snapshot; inspect state and last_operation_id for completion
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EIP'
                "400":
                    description: Invalid name, description or idempotency key
                "401":
                    description: Missing, invalid, expired or revoked credentials
                "403":
                    description: Tenant, permission or subscription denied
                "503":
                    description: Network dependency, trusted identity or public address pool unavailable
                "504":
                    description: Connected Network call timed out
            security:
                - BearerAuth: []
                - AccessKeyAuth: []
                  SignatureAuth: []
                  SignatureTime: []
    /api/v1/networks/eips/{eip_id}:
        get:
            tags:
                - NetworkService
            summary: Get an EIP in the authenticated tenant
            description: Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:eip:get permission. Only tenant-managed Public EIPs are visible; System-managed Intranet addresses are excluded including guessed IDs. Cross-tenant and missing EIPs both return 404.
            operationId: NetworkService_GetEIP
            parameters:
                - name: eip_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EIP'
                "400":
                    description: Invalid EIP ID
                "401":
                    description: Missing, invalid, expired or revoked credentials
                "403":
                    description: Tenant, permission or subscription denied
                "404":
                    description: EIP not found in this tenant
                "503":
                    description: Network dependency or trusted identity unavailable
                "504":
                    description: Connected Network call timed out
            security:
                - BearerAuth: []
                - AccessKeyAuth: []
                  SignatureAuth: []
                  SignatureTime: []
        delete:
            tags:
                - NetworkService
            summary: Release an EIP in the authenticated tenant
            description: Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:eip:delete permission. Release is asynchronous; a bound EIP must be unbound first. Cross-tenant and missing EIPs both return 404.
            operationId: NetworkService_DeleteEIP
            parameters:
                - name: eip_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
