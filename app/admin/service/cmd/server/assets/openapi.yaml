                    description: VPC not found in this tenant
                "503":
                    description: Network dependency or trusted identity unavailable
                "504":
                    description: Connected Network call timed out
            security:
                - BearerAuth: []
                - AccessKeyAuth: []
                  SignatureAuth: []
                  SignatureTime: []
    /api/v1/networks/vpcs/{vpc_id}/snat/bindings:
        post:
            tags:
                - NetworkService
            summary: Bind a public EIP as a VPC's SNAT egress
            description: Requires user JWT or ANI HMAC-SHA256 signature, NETWORK subscription and network:snat:bind permission. Binding is asynchronous and exclusive; retries with the same idempotency_key replay the original result.
            operationId: NetworkService_BindVPCSnat
            parameters:
                - name: vpc_id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BindVPCSnatRequest'
                required: true
            responses:
                "200":
                    description: Accepted resource snapshot; inspect state and last_operation_id for completion
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VPCSnat'
                "400":
                    description: Invalid VPC or EIP ID
                "401":
                    description: Missing, invalid, expired or revoked credentials
                "403":
                    description: Tenant, permission or subscription denied
                "404":
                    description: VPC or EIP not found in this tenant
                "503":
                    description: Network dependency or trusted identity unavailable
                "504":
                    description: Connected Network call timed out
            security:
                - BearerAuth: []
                - AccessKeyAuth: []
                  SignatureAuth: []
                  SignatureTime: []
