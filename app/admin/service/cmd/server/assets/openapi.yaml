            tags:
                - ModelDevService
            operationId: ModelDevService_CreateExecution
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateExecutionRequest'
                required: true
            responses:
                "202":
                    description: Accepted; the frozen request and CPU delivery intent are durable
