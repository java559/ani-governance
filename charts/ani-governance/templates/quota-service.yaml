{{- if .Values.quotaInternal.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ani-governance.fullname" . }}-quota
  labels:
    {{- include "ani-governance.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ani-governance.selectorLabels" . | nindent 4 }}
  ports:
    - name: quota-grpc
      port: {{ .Values.quotaInternal.port }}
      targetPort: {{ .Values.quotaInternal.port }}
{{- end }}
