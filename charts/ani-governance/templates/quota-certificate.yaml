{{- if and .Values.quotaInternal.enabled .Values.quotaInternal.certificate.create }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.quotaInternal.serverSecret }}
  labels:
    {{- include "ani-governance.labels" . | nindent 4 }}
spec:
  secretName: {{ required "quotaInternal.serverSecret is required" .Values.quotaInternal.serverSecret }}
  issuerRef:
    {{- toYaml .Values.certificate.issuerRef | nindent 4 }}
  dnsNames:
    - ani-governance
  usages:
    - digital signature
    - server auth
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
{{- end }}
