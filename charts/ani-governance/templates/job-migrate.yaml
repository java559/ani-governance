{{- if .Values.bootstrap.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ani-governance.fullname" . }}-migrate
  labels:
    {{- include "ani-governance.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.bootstrap.migration.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ani-governance.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: atlas
          image: {{ include "ani-governance.image" .Values.atlasImage | quote }}
          imagePullPolicy: {{ .Values.atlasImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # This migration was deployed before the newer main-line
              # migration existed. Apply it alone if it is the only missing
              # historical revision; never silently run other old migrations.
              out_of_order=$(/bin/atlas migrate status --dir file:///app/migrations --url "$ANI_DATABASE_DSN" --format '{{ "{{" }}range .OutOfOrder{{ "}}" }}{{ "{{" }}.Name{{ "}}" }}{{ "{{" }}"\n"{{ "}}" }}{{ "{{" }}end{{ "}}" }}')
              case "$out_of_order" in
                '') ;;
                20261030010000_tenant_space_intent.sql)
                  /bin/atlas migrate apply 1 --dir file:///app/migrations --url "$ANI_DATABASE_DSN" --exec-order non-linear
                  ;;
                *)
                  printf '%s\n' "Unexpected out-of-order migrations; manual review required:" "$out_of_order" >&2
                  exit 1
                  ;;
              esac
              exec /bin/atlas migrate apply --dir file:///app/migrations --url "$ANI_DATABASE_DSN"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ATLAS_NO_UPDATE_NOTIFIER
              value: "1"
            - name: ANI_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.migrationSecret is required" .Values.database.migrationSecret }}
                  key: {{ .Values.database.dsnKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
