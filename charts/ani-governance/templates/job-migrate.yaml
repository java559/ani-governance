{{- if .Values.bootstrap.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ani-governance.fullname" . }}-migrate
  labels:
    {{- include "ani-governance.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.bootstrap.migration.hookWeight | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ani-governance.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: atlas
          image: {{ include "ani-governance.image" .Values.atlasImage | quote }}
          imagePullPolicy: {{ .Values.atlasImage.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - exec /bin/atlas migrate apply --dir file:///app/migrations --url "$ANI_DATABASE_DSN"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ATLAS_NO_UPDATE_NOTIFIER
              value: "1"
            - name: ANI_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.migrationSecret is required" .Values.database.migrationSecret }}
                  key: {{ .Values.database.dsnKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
