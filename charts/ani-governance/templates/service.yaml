apiVersion: v1
kind: Service
metadata:
  name: {{ include "ani-governance.fullname" . }}
  labels:
    {{- include "ani-governance.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ani-governance.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: sse
      port: {{ .Values.service.ssePort }}
      targetPort: sse
      protocol: TCP
