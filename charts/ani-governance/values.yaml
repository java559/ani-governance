# server、admin CLI、Atlas 迁移镜像；使用明确 tag 或 digest。
image:
  repository: docker.changqingyun.cn/ani/governance
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
adminImage:
  repository: docker.changqingyun.cn/ani/governance-admin
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
atlasImage:
  repository: docker.changqingyun.cn/ani/governance-atlas
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Casbin 策略刷新和 SSE 连接目前在进程内维护，先部署单副本。
replicaCount: 1
serviceAccount:
  create: true
  annotations: {}
  name: ""
rbac:
  # The server reads the registered Volcano scheduling configuration and
  # validates scheduling options through the Kubernetes API.
  create: true
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
service:
  type: NodePort
  httpPort: 7788
  # Leave empty to let Kubernetes allocate a NodePort.
  httpNodePort: null
  ssePort: 7789
  # Leave empty to let Kubernetes allocate a NodePort.
  sseNodePort: null
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
nodeSelector: {}
tolerations: []
affinity: {}
corsOrigins: []

# 认证写端点（登录/csrf/refresh/logout）的来源白名单，按应用绑定，注入
# GWA_AUTH_CONSOLE_ORIGINS / GWA_AUTH_BOSS_ORIGINS（逗号分隔精确 origin）。
# 默认给本地调试端口与集群内 Service DNS；实际部署按该环境前端地址增补。
# 注意：某应用配了专属集合后不再回退 corsOrigins，需把该应用全部前端 Origin
# （线上域名 + 本地调试端口）一次配全，否则该应用未被列出的来源一律 403。
auth:
  consoleOrigins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://ani-console.ani-system.svc.cluster.local
  bossOrigins:
    - http://localhost:5174
    - http://127.0.0.1:5174
    - http://ani-boss-console.ani-system.svc.cluster.local
  # 仅明文 HTTP 环境（如内网 NodePort 测试环境）置 true，降级 refresh cookie 的
  # Secure 属性；否则浏览器会拒收该 cookie，表现为"登录成功但刷新永远 401"。
  # 生产 HTTPS 必须保持 false。
  insecureRefreshCookie: false

config:
  # 配置文件包含运行账号 DSN、Redis 密码/Asynq URI、JWT 密钥，详见 README。
  existingSecret: ani-governance-config
  secretKey: zz-secrets.yaml
  authSecret: ani-governance-auth
  accessKeyKey: access-key-encryption-key
database:
  # Atlas/admin 使用独立迁移账号。业务运行账号只在上述配置 Secret 中配置。
  migrationSecret: ani-governance-migration
  dsnKey: dsn
# PostgreSQL / Redis 独立安装，本 Chart 不创建基础设施。
redis:
  address: redis.ani-infra.svc.cluster.local:6379
bootstrap:
  migration:
    enabled: true
    hookWeight: "-10"
  adminInit:
    enabled: true
    hookWeight: "-5"
    username: admin
    passwordSecret: ani-governance-auth
    passwordKey: admin-password
# API 增量同步按 docs/deployment.md 显式预览、执行，不随升级自动授权。

downstream:
  inference:
    enabled: false
    address: ""
    serverName: ""
    caSecret: ""
    caKey: ca.crt
    clientCertificateSecret: governance-client-tls
  model:
    enabled: false
    address: ""
    serverName: ""
    caSecret: ""
    caKey: ca.crt
    clientCertificateSecret: governance-client-tls
  accelerator:
    enabled: false
    address: ""
    serverName: ""
    caSecret: ""
    caKey: ca.crt
    clientCertificateSecret: governance-client-tls
certificate:
  enabled: false
  issuerRef:
    name: ani-internal
    kind: ClusterIssuer
  secretName: governance-client-tls
  dnsNames:
    - ani-governance
  duration: 72h
  renewBefore: 24h
