apiVersion: v1
kind: Service
metadata:
  name: {{ include "ani-governance-redis.fullname" . }}
  labels:
    {{- include "ani-governance-redis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "ani-governance-redis.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: redis
      protocol: TCP
