version: v2
clean: false
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/gnostic/gnostic
  override:
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go
    - file_option: go_package
      path: admin/service/v1
      value: go-wind-admin/api/gen/go/admin/service/v1;adminpb
    - file_option: go_package
      path: inference/service/v1
      value: go-wind-admin/api/gen/go/inference/service/v1;inferenceservicepb
    - file_option: go_package
      path: identity/service/v1
      value: go-wind-admin/api/gen/go/identity/service/v1;identitypb
    - file_option: go_package
      path: inference/view/v1
      value: go-wind-admin/api/gen/go/inference/view/v1;inferencev1
inputs:
  - directory: protos
    paths:
      - protos/admin/service/v1/i_inference.proto
      - protos/inference/service/v1/owner.proto
      - protos/inference/view/v1/view.proto
      - protos/identity/service/v1/module.proto
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-http
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-errors
    out: gen/go
    opt: paths=source_relative
