// The system VPC identity is output-only and fixed by Resource configuration.
message DefaultVPCEgress {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string pool_id = 3 [json_name = "pool_id"];
  string state = 4 [json_name = "state"];
  string reason = 5 [json_name = "reason"];
  int64 version = 6 [json_name = "version"];
  string last_operation_id = 7 [json_name = "last_operation_id"];
  string operation_state = 8 [json_name = "operation_state"];
  string phase = 9 [json_name = "phase"];
  bool pending_unknown = 10 [json_name = "pending_unknown"];
  string address = 11 [json_name = "address"];
  string eip_provider_name = 12 [json_name = "eip_provider_name"];
  string eip_provider_uid = 13 [json_name = "eip_provider_uid"];
  string snat_provider_name = 14 [json_name = "snat_provider_name"];
  string snat_provider_uid = 15 [json_name = "snat_provider_uid"];
  bool desired_enabled = 16 [json_name = "desired_enabled"];
  optional bool applied_enabled = 17 [json_name = "applied_enabled"];
  string cluster_id = 18 [json_name = "cluster_id"];
  string cluster_uid = 19 [json_name = "cluster_uid"];
  string default_vpc_namespace = 20 [json_name = "default_vpc_namespace"];
  string default_vpc_name = 21 [json_name = "default_vpc_name"];
  string default_vpc_uid = 22 [json_name = "default_vpc_uid"];
  google.protobuf.Timestamp created_at = 23 [json_name = "created_at"];
  google.protobuf.Timestamp updated_at = 24 [json_name = "updated_at"];
  google.protobuf.Timestamp observed_at = 25 [json_name = "observed_at"];
  int64 target_generation = 26 [json_name = "target_generation"];
  string pending_action = 27 [json_name = "pending_action"];
  bool observation_stale = 28 [json_name = "observation_stale"];
  string eip_id = 29 [json_name = "eip_id"];
}
message CreateDefaultVPCEgressData {
  string name = 1 [json_name = "name"];
  string pool_id = 2 [json_name = "pool_id"];
  string idempotency_key = 3 [json_name = "idempotency_key"];
}
message CreateDefaultVPCEgressRequest {
  CreateDefaultVPCEgressData data = 1 [json_name = "data"];
}
message CreateDefaultVPCEgressResponse {
  DefaultVPCEgress egress = 1 [json_name = "egress"];
}
message GetDefaultVPCEgressRequest {
  string egress_id = 1 [json_name = "egress_id"];
}
message GetCurrentDefaultVPCEgressRequest {}
message GetDefaultVPCEgressResponse {
  DefaultVPCEgress egress = 1 [json_name = "egress"];
}
message DeleteDefaultVPCEgressRequest {
  string egress_id = 1 [json_name = "egress_id"];
}
message DeleteDefaultVPCEgressResponse {
  DefaultVPCEgress egress = 1 [json_name = "egress"];
}
