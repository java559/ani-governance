message ListVlanNetworksResponse {
  repeated PlatformResource items = 1 [json_name = "items"];
  string next_cursor = 2 [json_name = "next_cursor"];
  int64 total = 3 [json_name = "total"];
}

message DeleteVlanNetworkRequest {
