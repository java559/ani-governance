syntax = "proto3";
package catalog.service.v1;
import "catalog/service/v1/vpc.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

message SecurityGroupPortRange { uint32 min=1; uint32 max=2; }
message SecurityGroupRuleInput {
 string direction=1; string protocol=2;
 repeated string remote_addresses=3 [json_name="remote_addresses"];
 repeated SecurityGroupPortRange port_ranges=4 [json_name="port_ranges"];
 string action=5; uint32 priority=6; string description=7;
}
message SecurityGroupRule {
 string id=1; string security_group_id=2 [json_name="security_group_id"];
 string direction=3; string protocol=4;
 repeated string remote_addresses=5 [json_name="remote_addresses"];
 repeated SecurityGroupPortRange port_ranges=6 [json_name="port_ranges"];
 string action=7; uint32 priority=8; string description=9;
 bool is_default=10 [json_name="is_default"];
}
message SecurityGroup {
 string id=1; string name=2; string description=3;
 reserved 4;
 string state=5; string reason=6; int64 version=7;
 reserved 8;
 google.protobuf.Timestamp created_at=9 [json_name="created_at"];
 google.protobuf.Timestamp updated_at=10 [json_name="updated_at"];
 google.protobuf.Timestamp observed_at=11 [json_name="observed_at"];
 reserved 12;
 string last_operation_id=13 [json_name="last_operation_id"];
 int64 bound_resource_count=15 [json_name="bound_resource_count"];
 repeated SecurityGroupRule rules=14;
}
message SecurityGroupBinding {
 string target_type=1 [json_name="target_type"]; string target_id=2 [json_name="target_id"];
 repeated string security_group_ids=3 [json_name="security_group_ids"];
 repeated string applied_security_group_ids=4 [json_name="applied_security_group_ids"];
 string state=5; string reason=6; int64 version=7;
 string last_operation_id=8 [json_name="last_operation_id"];
 google.protobuf.Timestamp observed_at=9 [json_name="observed_at"];
}
message CreateSecurityGroupData {
 string name=1; string description=2;
 reserved 3;
 string idempotency_key=4 [json_name="idempotency_key"];
 repeated SecurityGroupRuleInput rules=5;
}
message CreateSecurityGroupRequest { CreateSecurityGroupData data=1; }
message GetSecurityGroupRequest { string security_group_id=1 [json_name="security_group_id"]; }
message ListSecurityGroupsRequest {
 optional uint32 page=1; optional uint32 page_size=2 [json_name="pageSize"];
 string name=3; string state=4;
}
message ListSecurityGroupsResponse { repeated SecurityGroup items=1; int64 total=2; }
message UpdateSecurityGroupData {
 string name=1; string description=2;
 reserved 3;
 int64 expected_version=4 [json_name="expected_version"];
 string idempotency_key=5 [json_name="idempotency_key"];
}
message UpdateSecurityGroupRequest {
 string security_group_id=1 [json_name="security_group_id"];
 UpdateSecurityGroupData data=2;
 google.protobuf.FieldMask update_mask=3 [json_name="update_mask"];
}
message DeleteSecurityGroupRequest { string security_group_id=1 [json_name="security_group_id"]; }
message SecurityGroupResponse { SecurityGroup security_group=1 [json_name="security_group"]; Operation operation=2; }
message ListSecurityGroupRulesRequest {
 string security_group_id=1 [json_name="security_group_id"];
 optional uint32 page=2; optional uint32 page_size=3 [json_name="pageSize"];
 string direction=4;
}
message ListSecurityGroupRulesResponse { repeated SecurityGroupRule items=1; int64 total=2; int64 version=3; }
message CreateSecurityGroupRuleData {
 SecurityGroupRuleInput rule=1;
 int64 expected_version=2 [json_name="expected_version"];
 string idempotency_key=3 [json_name="idempotency_key"];
}
message CreateSecurityGroupRuleRequest { string security_group_id=1 [json_name="security_group_id"]; CreateSecurityGroupRuleData data=2; }
message UpdateSecurityGroupRuleRequest {
 string security_group_id=1 [json_name="security_group_id"];
 string rule_id=2 [json_name="rule_id"];
 CreateSecurityGroupRuleData data=3;
}
message DeleteSecurityGroupRuleRequest { string security_group_id=1 [json_name="security_group_id"]; string rule_id=2 [json_name="rule_id"]; }
message SecurityGroupRuleResponse { SecurityGroup security_group=1 [json_name="security_group"]; SecurityGroupRule rule=2; Operation operation=3; }
message ListSecurityGroupBindingsRequest {
 string security_group_id=1 [json_name="security_group_id"];
 optional uint32 page=2; optional uint32 page_size=3 [json_name="pageSize"];
 string target_type=4 [json_name="target_type"];
}
message ListSecurityGroupBindingsResponse { repeated SecurityGroupBinding items=1; int64 total=2; }
message SetEIPSecurityGroupsData {
 repeated string security_group_ids=1 [json_name="security_group_ids"];
 int64 expected_version=2 [json_name="expected_version"];
 string idempotency_key=3 [json_name="idempotency_key"];
}
message SetEIPSecurityGroupsRequest { string eip_id=1 [json_name="eip_id"]; SetEIPSecurityGroupsData data=2; }
message SetEIPSecurityGroupsResponse { SecurityGroupBinding binding=1; Operation operation=2; }
message GetEIPSecurityGroupsRequest { string eip_id=1 [json_name="eip_id"]; }
message GetSecurityGroupOperationRequest {string operation_id=1 [json_name="operation_id"];}
