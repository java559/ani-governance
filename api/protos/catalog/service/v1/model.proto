syntax = "proto3";

package catalog.service.v1;

import "google/protobuf/timestamp.proto";

message ModelVersion {
  string id = 1;
  string model_id = 2 [json_name = "model_id"];
  string version = 3;
  string format = 4;
  bool is_encrypted = 5 [json_name = "is_encrypted"];
  string encrypt_algo = 6 [json_name = "encrypt_algo"];
  string encrypt_hint = 7 [json_name = "encrypt_hint"];
  int64 size_bytes = 8 [json_name = "size_bytes"];
  string checksum_sha256 = 9 [json_name = "checksum_sha256"];
  string storage_path = 10 [json_name = "storage_path"];
  google.protobuf.Timestamp created_at = 11 [json_name = "created_at"];
  string status = 12;
  string engine_type = 13 [json_name = "engine_type"];
  string startup_command = 14 [json_name = "startup_command"];
  reserved 15;
  string engine_image = 16 [json_name = "engine_image"];
}

message Model {
  string id = 1;
  string name = 2;
  string display_name = 3 [json_name = "display_name"];
  string description = 4;
  string source = 5;
  string source_repo_id = 6 [json_name = "source_repo_id"];
  repeated string capabilities = 7;
  string status = 8;
  string error_message = 9 [json_name = "error_message"];
  int64 total_size_bytes = 10 [json_name = "total_size_bytes"];
  repeated ModelVersion versions = 11;
  google.protobuf.Timestamp created_at = 12 [json_name = "created_at"];
  google.protobuf.Timestamp updated_at = 13 [json_name = "updated_at"];
  string model_id = 14 [json_name = "model_id"];
}

message ImportTask {
  string task_id = 1 [json_name = "task_id"];
  string task_type = 2 [json_name = "task_type"];
  string status = 3;
  string location_url = 4 [json_name = "location_url"];
  string model_id = 5 [json_name = "model_id"];
  string model_version_id = 6 [json_name = "model_version_id"];
  int32 attempt_count = 7 [json_name = "attempt_count"];
  int32 progress_pct = 8 [json_name = "progress_pct"];
  string error_message = 9 [json_name = "error_message"];
  google.protobuf.Timestamp created_at = 10 [json_name = "created_at"];
  google.protobuf.Timestamp completed_at = 11 [json_name = "completed_at"];
}

message CreateModelRequest {
  // The former envelope field is retired; public JSON fields are top-level.
  reserved 1;
  reserved "data";
  string name = 2;
  string display_name = 3 [json_name = "display_name"];
  string description = 4;
  repeated string capabilities = 5;
  string idempotency_key = 6 [json_name = "idempotency_key"];
  string model_id = 7 [json_name = "model_id"];
}
message CreateModelResponse { Model model = 1; }

message GetModelRequest { string model_id = 1 [json_name = "model_id"]; }
message GetModelResponse { Model model = 1; }

message ListModelsRequest {
  string status = 1;
  reserved 2;
  string keyword = 3;
  string source = 4;
  string capability = 5;
  optional int32 page = 6;
  optional int32 page_size = 7 [json_name = "pageSize"];
}
message ListModelsResponse {
  reserved 1, 2;
  repeated Model items = 3;
  int64 total = 4;
}

message SearchExternalModelsRequest {
  string source = 1;
  string keyword = 2;
  string owner = 3;
  string task = 4;
  string library = 5;
  reserved 6;
  optional int32 page = 7;
  optional int32 page_size = 8 [json_name = "pageSize"];
}
message ExternalModelCandidate {
  string source = 1;
  string repo_id = 2 [json_name = "repo_id"];
  string name = 3;
  string display_name = 4 [json_name = "display_name"];
  string description = 5;
  string revision = 6;
  int64 size_bytes = 7 [json_name = "size_bytes"];
  repeated string tags = 8;
  google.protobuf.Timestamp updated_at = 9 [json_name = "updated_at"];
}
message SearchExternalModelsResponse {
  reserved 1, 2;
  repeated ExternalModelCandidate items = 3;
  bool has_more = 5 [json_name = "hasMore"];
}

message DeleteModelRequest { string model_id = 1 [json_name = "model_id"]; }
message DeleteModelVersionRequest { string model_version_id = 1 [json_name = "model_version_id"]; }

message GetUploadURLData {
  string version = 1;
  string file_name = 2 [json_name = "file_name"];
  int64 size_bytes = 3 [json_name = "size_bytes"];
  string idempotency_key = 4 [json_name = "idempotency_key"];
  string checksum_sha256 = 5 [json_name = "checksum_sha256"];
}
message GetUploadURLRequest {
  string model_id = 1 [json_name = "model_id"];
  GetUploadURLData data = 2;
}
message GetUploadURLResponse {
  string upload_url = 1 [json_name = "upload_url"];
  string storage_path = 2 [json_name = "storage_path"];
  string doc_id = 3 [json_name = "doc_id"];
  google.protobuf.Timestamp expires_at = 4 [json_name = "expires_at"];
  map<string, string> upload_headers = 5 [json_name = "upload_headers"];
  string model_version_id = 6 [json_name = "model_version_id"];
}

message GetModelDownloadURLRequest {
  string model_version_id = 1 [json_name = "model_version_id"];
  string file_path = 2 [json_name = "file_path"];
}
message GetModelDownloadURLResponse {
  string download_url = 1 [json_name = "download_url"];
  string storage_path = 2 [json_name = "storage_path"];
  bool is_encrypted = 3 [json_name = "is_encrypted"];
  string encrypt_algo = 4 [json_name = "encrypt_algo"];
  string encrypt_hint = 5 [json_name = "encrypt_hint"];
  google.protobuf.Timestamp expires_at = 6 [json_name = "expires_at"];
}

message CreateModelVersionRequest {
  // The former envelope field is retired; public JSON fields are top-level.
  reserved 1;
  reserved "data";
  string model_id = 2 [json_name = "model_id"];
  string version = 3;
  string format = 4;
  string storage_path = 5 [json_name = "storage_path"];
  string checksum_sha256 = 6 [json_name = "checksum_sha256"];
  int64 size_bytes = 7 [json_name = "size_bytes"];
  bool is_encrypted = 8 [json_name = "is_encrypted"];
  string encrypt_algo = 9 [json_name = "encrypt_algo"];
  string encrypt_hint = 10 [json_name = "encrypt_hint"];
  string idempotency_key = 11 [json_name = "idempotency_key"];
  string engine_type = 12 [json_name = "engine_type"];
  string startup_command = 13 [json_name = "startup_command"];
  reserved 14;
  string engine_image = 15 [json_name = "engine_image"];
}
message CreateModelVersionResponse { ModelVersion version = 1; }

message GetModelVersionRequest {
  string model_version_id = 1 [json_name = "model_version_id"];
  string model_id = 2 [json_name = "model_id"];
  string version = 3;
}
message GetModelVersionResponse {
  Model model = 1;
  ModelVersion version = 2;
}

message ListModelVersionsRequest {
  string model_id = 1 [json_name = "model_id"];
  reserved 2;
  optional int32 page = 3;
  optional int32 page_size = 4 [json_name = "pageSize"];
  string status = 5;
}
message ListModelVersionsResponse {
  reserved 1, 2;
  repeated ModelVersion items = 3;
  int64 total = 4;
}

message ImportModelRequest {
  // The former envelope field is retired; public JSON fields are top-level.
  reserved 1;
  reserved "data";
  string source = 2;
  string repo_id = 3 [json_name = "repo_id"];
  string revision = 4;
  string idempotency_key = 5 [json_name = "idempotency_key"];
  string webhook_url = 6 [json_name = "webhook_url"];
  string model_id = 7 [json_name = "model_id"];
  string model_version_id = 8 [json_name = "model_version_id"];
}
message ImportModelResponse { ImportTask task = 1; }

// ImportModelBundleRequest creates the model, version and remote import task
// in one idempotent Model-service operation. Tenant identity is resolved by
// the Governance BFF and is intentionally absent from this public DTO.
message ImportModelBundleModelData {
  string name = 1;
  string display_name = 2 [json_name = "display_name"];
  string description = 3;
  repeated string capabilities = 4;
  string external_model_id = 5 [json_name = "external_model_id"];
}

message ImportModelBundleVersionData {
  string version = 1;
  string format = 2;
  string engine_type = 3 [json_name = "engine_type"];
  string engine_image = 4 [json_name = "engine_image"];
  string startup_command = 5 [json_name = "startup_command"];
}

message ImportModelBundleSourceData {
  string provider = 1;
  string repo_id = 2 [json_name = "repo_id"];
  string revision = 3;
}

message ImportModelBundleRequest {
  // The former envelope field is retired; public JSON fields are top-level.
  reserved 1;
  reserved "data";
  string idempotency_key = 2 [json_name = "idempotency_key"];
  ImportModelBundleModelData model = 3;
  ImportModelBundleVersionData version = 4;
  ImportModelBundleSourceData source = 5;
}

message ImportModelBundleResponse {
  Model model = 1;
  ModelVersion version = 2;
  ImportTask task = 3;
}

message GetImportTaskRequest { string task_id = 1 [json_name = "task_id"]; }
message GetImportTaskResponse { ImportTask task = 1; }
message GetImportTaskLogsRequest { string task_id = 1 [json_name = "task_id"]; }
message GetImportTaskLogsResponse {
  string task_id = 1 [json_name = "task_id"];
  string status = 2;
  string logs = 3;
  bool available = 4;
}
message RetryImportTaskRequest { string task_id = 1 [json_name = "task_id"]; }
message RetryImportTaskResponse { ImportTask task = 1; }

// Operation history is tenant scoped and newest first. Accepted imports are
// queued work, not completed imports.
message ListModelOperationsRequest {
  string model_id = 1 [json_name = "model_id"];
  optional int32 page = 2;
  optional int32 page_size = 3 [json_name = "pageSize"];
}
message ListModelOperationsResponse {
  repeated ModelOperation items = 1;
  int64 total = 2;
}
message ModelOperation {
  string id = 1;
  string model_id = 2 [json_name = "model_id"];
  string model_version_id = 3 [json_name = "model_version_id"];
  string action = 4;
  string actor = 5;
  string result = 6;
  string before_state = 7 [json_name = "before_state"];
  string after_state = 8 [json_name = "after_state"];
  string error_class = 9 [json_name = "error_class"];
  string request_id = 10 [json_name = "request_id"];
  google.protobuf.Timestamp created_at = 11 [json_name = "created_at"];
  string task_id = 12 [json_name = "task_id"];
}
