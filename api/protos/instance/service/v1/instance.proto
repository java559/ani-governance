syntax = "proto3";
package instance.service.v1;
import "google/protobuf/field_mask.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

message SchedulingOptions {
 enum PodPlacement { POD_PLACEMENT_UNSPECIFIED = 0; NONE = 1; COLOCATE_PREFERRED = 2; SPREAD_PREFERRED = 3; }
 optional PodPlacement pod_placement = 1 [json_name = "pod_placement"];
 optional string priority_class_name = 2 [json_name = "priority_class_name"];
}

message CreateInstanceData {
  string idempotency_key = 1;
  string name = 2;
  string image_id = 3;
  string image_scope = 4;
  string preset_id = 5;
  reserved 6;
  reserved "preset_version";
  SchedulingOptions scheduling = 7;
}
message CreateInstanceRequest { CreateInstanceData data = 1; }
message ChangeInstanceData { string instance_id = 1; string idempotency_key = 2; int64 expected_version = 3; }
message ChangeInstanceRequest { ChangeInstanceData data = 1; }
message GetInstanceRequest { string instance_id = 1 [json_name = "instance_id"]; }
message ListInstancesRequest {
 reserved 1, 2;
 reserved "after_id";
 optional uint32 page = 3;
 optional uint32 page_size = 4 [json_name = "pageSize"];
 string instance_kind = 5 [json_name = "instance_kind"];
 string compute_type = 6 [json_name = "compute_type"];
 string observed_state = 7;
 string name = 8;
}
message ListPresetsRequest {
 optional uint32 page = 1;
 optional uint32 page_size = 2 [json_name = "pageSize"];
 string name = 3; string code = 4;
 string compute_type = 5 [json_name = "compute_type"];
 string gpu_mode = 6 [json_name = "gpu_mode"];
}
message GetOperationRequest { string operation_id = 1 [json_name = "operation_id"]; }
message ExecInstanceData { string instance_id = 1; string idempotency_key = 2; int64 expected_version = 3; int32 rows = 4; int32 cols = 5; }
message ExecInstanceRequest { ExecInstanceData data = 1; }
message Instance {
 string id = 1; string name = 2; int64 version = 3;
 string desired_state = 4; string observed_state = 5; string reason = 6;
 string image_id = 7; string image_digest = 8; string preset_id = 9;
 reserved 10, 16;
 reserved "preset_version", "instance_type";
 string create_operation_id = 11; string last_operation_id = 12;
 bool compute_cleaned = 13; bool workspace_cleaned = 14; bool quota_returned = 15;
 string instance_kind = 17 [json_name = "instance_kind"];
 string compute_type = 18 [json_name = "compute_type"];
 string cpu = 19; string memory = 20; string created_at = 21;
 string workspace_size = 22;
 string preset_name = 23 [json_name = "preset_name"];
 string preset_code = 24 [json_name = "preset_code"];
 GpuSummary gpu_summary = 25 [json_name = "gpu_summary"];
 SchedulingOptions scheduling = 26;
}
message ListInstancesResponse { repeated Instance items = 1; reserved 2; reserved "next_after_id"; int64 total = 3; }
message Acceptance { string operation_id = 1; string resource_id = 2; bool replayed = 3; string result = 4; }
message Operation { string id = 1; string instance_id = 2; string action = 3; int64 intent_version = 4; string state = 5; string reason = 6; }
message GpuSummary {
 string profile_id = 1 [json_name = "profile_id"];
 uint64 profile_version = 2 [json_name = "profile_version"];
 string mode = 3;
 string model_key = 4 [json_name = "model_key"];
 uint32 devices_per_instance = 5 [json_name = "devices_per_instance"];
 reserved 6, 7; reserved "shared_memory_mib_per_device", "shared_memory_mib_total";
 int64 memory_mib_per_device = 9 [json_name = "memory_mib_per_device"];
 int64 memory_mib_total = 10 [json_name = "memory_mib_total"];

 uint32 core_limit_percent = 8 [json_name = "core_limit_percent"];
}
message Preset {
 string id = 1; string name = 3;
 reserved 2, 4, 5, 6; reserved "version", "cpu", "memory", "instance_type";
 string code = 7; string description = 8;
 string compute_type = 9 [json_name = "compute_type"];
 int64 cpu_millis = 10 [json_name = "cpu_millis"];
 int64 memory_mib = 11 [json_name = "memory_mib"];
 bool enabled = 12; GpuSummary gpu = 13;
 string created_at = 14 [json_name = "created_at"];
 string updated_at = 15 [json_name = "updated_at"];
 bool selectable = 16; string unavailable_reason = 17 [json_name = "unavailable_reason"];
}
message ListPresetsResponse { repeated Preset items = 1; int64 total = 2; string gpu_catalog_status = 3 [json_name = "gpu_catalog_status"]; string gpu_catalog_reason = 4 [json_name = "gpu_catalog_reason"]; }
message PresetGpuInput {
 string profile_id = 1 [json_name = "profile_id"];
 uint64 profile_version = 2 [json_name = "profile_version"];
 uint32 devices_per_instance = 3 [json_name = "devices_per_instance"];
}
message PresetData {
 string code = 1; string name = 2; string description = 3;
 string compute_type = 4 [json_name = "compute_type"];
 int64 cpu_millis = 5 [json_name = "cpu_millis"];
 int64 memory_mib = 6 [json_name = "memory_mib"];
 optional bool enabled = 7; PresetGpuInput gpu = 8;
}
message AdminListPresetsRequest {
 optional uint32 page = 1; optional uint32 page_size = 2 [json_name = "pageSize"];
 string name = 3; string code = 4;
 string compute_type = 5 [json_name = "compute_type"];
 string gpu_mode = 6 [json_name = "gpu_mode"];
 optional bool enabled = 7;
}
message AdminListPresetsResponse { repeated Preset items = 1; int64 total = 2; }
message PresetRequest { string id = 1; }
message CreatePresetRequest { PresetData data = 1; }
message UpdatePresetRequest { string id = 1; PresetData data = 2; google.protobuf.FieldMask update_mask = 3 [json_name = "update_mask"]; }
message SetPresetEnabledData { optional bool enabled = 1; }
message SetPresetEnabledRequest { string id = 1; SetPresetEnabledData data = 2; }
message Empty {}
message EnvironmentSource { string name = 1; string source_type = 2; }
message RuntimeMount { string name = 1; string volume_type = 2; string mount_path = 3; bool read_only = 4; }
message RuntimePod {
 string name = 1; string uid = 2; string node_name = 3; string pod_ip = 4;
 string phase = 5; bool ready = 6; string reason = 7; string message = 8;
 repeated EnvironmentSource environment_sources = 9; repeated RuntimeMount mounts = 10;
}
message RuntimeStatefulSet { google.protobuf.Int32Value desired_replicas = 1; google.protobuf.Int32Value ready_replicas = 2; }
message InstanceRuntime {
 string instance_id = 1 [json_name = "instance_id"]; int64 version = 2; google.protobuf.Timestamp observed_at = 3;
 RuntimePod pod = 4; RuntimeStatefulSet stateful_set = 5 [json_name = "statefulSet"];
}
message InstanceEvent { string type = 1; string reason = 2; string message = 3; google.protobuf.Timestamp last_occurred_at = 4; google.protobuf.Int64Value count = 5; }
message InstanceEvents { google.protobuf.StringValue pod_uid = 1; google.protobuf.Timestamp observed_at = 2; repeated InstanceEvent events = 3; bool truncated = 4; }
message InstanceLogsRequest { string instance_id = 1 [json_name = "instance_id"]; optional uint32 tail_lines = 2; optional bool follow = 3; }
message InstanceLogFrame {
 enum Kind { KIND_UNSPECIFIED = 0; READY = 1; DATA = 2; END = 3; ERROR = 4; }
 Kind kind = 1; bytes data = 2; string reason = 3;
}
message ExecInstanceResponse { string session_id = 1; string ws_url = 2; string expires_at = 3; }

// Raw registered Volcano configuration; saving confirms the ConfigMap write only.
message SchedulerConfigRequest {}
message SchedulerConfig {
 string config=1;
 string resource_version=2 [json_name="resource_version"];
}
message SchedulerConfigData {
 string config=1;
 string expected_resource_version=2 [json_name="expected_resource_version"];
}
message UpdateSchedulerConfigRequest { SchedulerConfigData data=1; }

message PriorityClassAllowlist {
 uint32 tenant_id=1 [json_name="tenant_id"];
 repeated string priority_class_names=2 [json_name="priority_class_names"];
}
message InstanceSchedulingSettings {
 SchedulingOptions defaults=1;
 repeated PriorityClassAllowlist priority_class_allowlists=2 [json_name="priority_class_allowlists"];
}
message InstanceSchedulingSettingsRequest {}
message UpdateInstanceSchedulingSettingsRequest { InstanceSchedulingSettings data=1; }
