syntax = "proto3";
package instance.service.v1;
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "gnostic/openapi/v3/annotations.proto";

message QueryInstanceMetricsRequest {
  string instance_id = 1 [json_name = "instance_id"];
  QueryInstanceMetricsData data = 2;
}
message QueryInstanceMetricsData {
  repeated string metric_codes = 1 [json_name = "metric_codes"];
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  optional uint32 step_seconds = 4 [json_name = "step_seconds"];
}
message QueryInstanceMetricsResponse { InstanceMetricsRangeData data = 1; }
message InstanceMetricsRangeData {
  string instance_id = 1 [json_name = "instance_id"];
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
  uint32 step_seconds = 4 [json_name = "step_seconds"];
  repeated InstanceMetricSeries series = 5;
}
message GetInstanceLatestMetricsResponse { InstanceMetricsLatestData data = 1; }
message InstanceMetricsLatestData {
  string instance_id = 1 [json_name = "instance_id"];
  google.protobuf.Timestamp evaluated_at = 2 [json_name = "evaluated_at"];
  repeated InstanceMetricSeries series = 3;
}
message InstanceMetricSeries {
  string metric_code = 1 [json_name = "metric_code"];
  string unit = 2;
  string status = 3;
  repeated InstanceMetricPoint points = 4;
}
message InstanceMetricPoint {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.DoubleValue value = 2 [(gnostic.openapi.v3.property) = { nullable: true }];
  optional string gap_reason = 3 [json_name = "gap_reason"];
}

// 首页资源趋势（租户级聚合）：metric=cpu|memory|gpu，range=1d|7d|30d。
// start/end/step 显式传入时必须落在所选档位约束内；租户身份只从 JWT 取。
message QueryResourceTrendRequest {
  string metric = 1;
  string range = 2 [json_name = "range"];
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
  optional uint32 step_seconds = 5 [json_name = "step_seconds"];
}
message QueryResourceTrendResponse { ResourceTrendData data = 1; }
message ResourceTrendData {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  uint32 step_seconds = 3 [json_name = "step_seconds"];
  repeated ResourceTrendSeries series = 4;
}
message ResourceTrendSeries {
  string metric = 1;
  string metric_code = 2 [json_name = "metric_code"];
  string unit = 3;
  string status = 4;
  repeated ResourceTrendPoint points = 5;
}
message ResourceTrendPoint {
  google.protobuf.Timestamp timestamp = 1;
  google.protobuf.DoubleValue value = 2 [(gnostic.openapi.v3.property) = { nullable: true }];
  optional string gap_reason = 3 [json_name = "gap_reason"];
}

message SchedulingOptions {
 enum PodPlacement { POD_PLACEMENT_UNSPECIFIED = 0; NONE = 1; COLOCATE_PREFERRED = 2; SPREAD_PREFERRED = 3; }
 optional PodPlacement pod_placement = 1 [json_name = "pod_placement"];
 optional string priority_class_name = 2 [json_name = "priority_class_name"];
}

message CreateInstanceData {
  string idempotency_key = 1;
  string name = 2;
  string image_id = 3;
  string image_scope = 4;
  string preset_id = 5;
  reserved 6;
  reserved "preset_version";
  SchedulingOptions scheduling = 7;
  optional string workspace_mount_path = 8 [json_name = "workspace_mount_path"];
  repeated VolumeMount volume_mounts = 9 [json_name = "volume_mounts"];
  NetworkSelection network = 10;
  map<string, string> labels = 11;
  map<string, string> annotations = 12;
  repeated InstanceEnvVar env = 13;
}
message VolumeMount {
 string pvc_name = 1 [json_name = "pvc_name"];
 string mount_path = 2 [json_name = "mount_path"];
 bool read_only = 3 [json_name = "read_only"];
}
message NetworkSelection {
 string vpc_id = 1 [json_name = "vpc_id"];
 string subnet_id = 2 [json_name = "subnet_id"];
}
message InstanceEnvVar { string name = 1; string value = 2; }
message ListMountablePVCsRequest {
 optional uint32 page = 1;
 optional uint32 page_size = 2 [json_name = "pageSize"];
 string name = 3;
}
message MountablePVC {
 string pvc_name = 1 [json_name = "pvc_name"]; string phase = 2;
 string requested_capacity = 3 [json_name = "requested_capacity"];
 repeated string access_modes = 4 [json_name = "access_modes"];
 string volume_mode = 5 [json_name = "volume_mode"];
 bool selectable = 6; string unavailable_reason = 7 [json_name = "unavailable_reason"];
}
message ListInstanceMountablePVCsRequest {
 string instance_id = 1 [json_name = "instance_id"];
 optional uint32 page = 2;
 optional uint32 page_size = 3 [json_name = "pageSize"];
 string name = 4;
}
message ListMountablePVCsResponse { repeated MountablePVC items = 1; int64 total = 2; }
message InstanceConfiguration {
 string instance_id = 1 [json_name = "instance_id"];
 // 服务器保存的当前配置合同版本，固定为 2。
 uint32 instance_contract_version = 2 [json_name = "instance_contract_version"];
 string workspace_mount_path = 3 [json_name = "workspace_mount_path"];
 repeated VolumeMount volume_mounts = 4 [json_name = "volume_mounts"];
 NetworkSelection network = 5;
 map<string,string> labels = 6; map<string,string> annotations = 7;
 repeated InstanceEnvVar env = 8;
 int64 version = 9;
 int64 applied_mount_version = 10 [json_name = "applied_mount_version"];
 PendingMountChange pending_change = 11 [json_name = "pending_change"];
}
message MountConfiguration { repeated VolumeMount volume_mounts = 1 [json_name = "volume_mounts"]; }
message PendingMountChange {
 string operation_id = 1 [json_name = "operation_id"];
 int64 intent_version = 2 [json_name = "intent_version"];
 string phase = 3;
 MountConfiguration target_configuration = 4 [json_name = "target_configuration"];
}
message CreateInstanceRequest { CreateInstanceData data = 1; }
message ChangeInstanceData { string instance_id = 1; string idempotency_key = 2; int64 expected_version = 3; }
message ChangeInstanceRequest { ChangeInstanceData data = 1; }
message AttachInstancePVCData {
 string instance_id = 1;
 string idempotency_key = 2;
 int64 expected_version = 3;
 string pvc_name = 4 [json_name = "pvc_name"];
 string mount_path = 5 [json_name = "mount_path"];
 bool read_only = 6 [json_name = "read_only"];
 bool restart_if_running = 7 [json_name = "restart_if_running"];
}
message AttachInstancePVCRequest { AttachInstancePVCData data = 1; }
message DetachInstancePVCData {
 string instance_id = 1;
 string idempotency_key = 2;
 int64 expected_version = 3;
 string mount_path = 4 [json_name = "mount_path"];
 bool restart_if_running = 5 [json_name = "restart_if_running"];
}
message DetachInstancePVCRequest { DetachInstancePVCData data = 1; }
message GetInstanceRequest { string instance_id = 1 [json_name = "instance_id"]; }
message ListInstancesRequest {
 reserved 1, 2;
 reserved "after_id";
 optional uint32 page = 3;
 optional uint32 page_size = 4 [json_name = "pageSize"];
 string instance_kind = 5 [json_name = "instance_kind"];
 string compute_type = 6 [json_name = "compute_type"];
 string observed_state = 7;
 string name = 8;
 string id = 9;
}
message GetOperationRequest { string operation_id = 1 [json_name = "operation_id"]; }
message ExecInstanceData { string instance_id = 1; string idempotency_key = 2; int64 expected_version = 3; int32 rows = 4; int32 cols = 5; }
message ExecInstanceRequest { ExecInstanceData data = 1; }
message Instance {
 string id = 1; string name = 2; int64 version = 3;
 string desired_state = 4; string observed_state = 5; string reason = 6;
 string image_id = 7; string image_digest = 8; string preset_id = 9;
 reserved 10, 16;
 reserved "preset_version", "instance_type";
 string create_operation_id = 11; string last_operation_id = 12;
 bool compute_cleaned = 13; bool workspace_cleaned = 14; bool quota_returned = 15;
 string instance_kind = 17 [json_name = "instance_kind"];
 string compute_type = 18 [json_name = "compute_type"];
 string cpu = 19; string memory = 20; string created_at = 21;
 string workspace_size = 22;
 string preset_name = 23 [json_name = "preset_name"];
 string preset_code = 24 [json_name = "preset_code"];
 GpuSummary gpu_summary = 25 [json_name = "gpu_summary"];
 SchedulingOptions scheduling = 26;
 // Safe lifecycle observations; dynamic state does not alter the frozen CREATE.
 string network_state = 27;
 string network_reason = 28;
 bool network_cleaned = 29;
 bool volume_references_released = 30;
 string active_operation_id = 31;
 string execution_run_state = 32;
 int64 applied_mount_version = 33;
}
message ListInstancesResponse { repeated Instance items = 1; reserved 2; reserved "next_after_id"; int64 total = 3; }
message Acceptance { string operation_id = 1; string resource_id = 2; bool replayed = 3; string result = 4; }
message Operation {
 string id = 1; string instance_id = 2; string action = 3; int64 intent_version = 4; string state = 5; string reason = 6;
 string phase = 7;
 MountConfiguration target_configuration = 8 [json_name = "target_configuration"];
 string final_run_state = 9 [json_name = "final_run_state"];
 int64 applied_mount_version = 10 [json_name = "applied_mount_version"];
 string completion_scope = 11 [json_name = "completion_scope"];
 string failure_reason = 12 [json_name = "failure_reason"];
}
message GpuSummary {
 string profile_id = 1 [json_name = "profile_id"];
 uint64 profile_version = 2 [json_name = "profile_version"];
 string mode = 3;
 string model_key = 4 [json_name = "model_key"];
 uint32 devices_per_instance = 5 [json_name = "devices_per_instance"];
 reserved 6, 7; reserved "shared_memory_mib_per_device", "shared_memory_mib_total";
 int64 memory_mib_per_device = 9 [json_name = "memory_mib_per_device"];
 int64 memory_mib_total = 10 [json_name = "memory_mib_total"];

 uint32 core_limit_percent = 8 [json_name = "core_limit_percent"];
}
message EnvironmentSource { string name = 1; string source_type = 2; }
message RuntimeMount { string name = 1; string volume_type = 2; string mount_path = 3; bool read_only = 4; }
message RuntimePod {
 string name = 1; string uid = 2; string node_name = 3; string pod_ip = 4;
 string phase = 5; bool ready = 6; string reason = 7; string message = 8;
 repeated EnvironmentSource environment_sources = 9; repeated RuntimeMount mounts = 10;
}
message RuntimeStatefulSet { google.protobuf.Int32Value desired_replicas = 1; google.protobuf.Int32Value ready_replicas = 2; }
message InstanceRuntime {
 string instance_id = 1 [json_name = "instance_id"]; int64 version = 2; google.protobuf.Timestamp observed_at = 3;
 RuntimePod pod = 4; RuntimeStatefulSet stateful_set = 5 [json_name = "statefulSet"];
}
message InstanceEvent { string type = 1; string reason = 2; string message = 3; google.protobuf.Timestamp last_occurred_at = 4; google.protobuf.Int64Value count = 5; }
message InstanceEvents { google.protobuf.StringValue pod_uid = 1; google.protobuf.Timestamp observed_at = 2; repeated InstanceEvent events = 3; bool truncated = 4; }
message InstanceLogsRequest { string instance_id = 1 [json_name = "instance_id"]; optional uint32 tail_lines = 2; optional bool follow = 3; }
message InstanceLogFrame {
 enum Kind { KIND_UNSPECIFIED = 0; READY = 1; DATA = 2; END = 3; ERROR = 4; }
 Kind kind = 1; bytes data = 2; string reason = 3;
}
message ExecInstanceResponse { string session_id = 1; string ws_url = 2; string expires_at = 3; }

// Raw registered Volcano configuration; saving confirms the ConfigMap write only.
message SchedulerConfigRequest {}
message SchedulerConfig {
 string config=1;
 string resource_version=2 [json_name="resource_version"];
}
message SchedulerConfigData {
 string config=1;
 string expected_resource_version=2 [json_name="expected_resource_version"];
}
message UpdateSchedulerConfigRequest { SchedulerConfigData data=1; }

message PriorityClassAllowlist {
 uint32 tenant_id=1 [json_name="tenant_id"];
 repeated string priority_class_names=2 [json_name="priority_class_names"];
}
message InstanceSchedulingSettings {
 SchedulingOptions defaults=1;
 repeated PriorityClassAllowlist priority_class_allowlists=2 [json_name="priority_class_allowlists"];
}
message InstanceSchedulingSettingsRequest {}
message UpdateInstanceSchedulingSettingsRequest { InstanceSchedulingSettings data=1; }
