syntax = "proto3";
package inference.view.v1;

option go_package = "go-wind-admin/api/gen/go/inference/view/v1;inferencev1";

import "google/protobuf/timestamp.proto";

enum RuntimeMode {
  RUNTIME_MODE_UNSPECIFIED = 0;
  RUNTIME_MODE_DEPLOYMENT = 1;
  RUNTIME_MODE_LEADER_WORKER_SET = 2;
}

message Operation {
  string id = 1;
  string service_id = 2;
  string kind = 3;
  string phase = 4;
  string step = 5;
  int64 target_generation = 6;
  string error_code = 7;
  string error_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  string gov_dispatch_state = 11 [json_name = "gov_dispatch_state"];
  // NONE for CPU; GPU accounting is independent of owner cleanup completion.
  string refund_state = 12 [json_name = "refund_state"];

}
