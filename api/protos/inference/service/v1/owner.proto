syntax = "proto3";
package inference.service.v1;

import "inference/view/v1/view.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "gnostic/openapi/v3/annotations.proto";

// Public user intent. Trusted attachments, charges, identity and destination
// are assembled by Governance and have no representation in this DTO.
message CreateInferenceRequest {
  option (gnostic.openapi.v3.schema) = {
    example: {yaml: "{\"data\":{\"idempotency_key\":\"20000000-0000-4000-8000-000000000001\",\"name\":\"qwen-inference\",\"model_version_id\":\"30000000-0000-4000-8000-000000000001\",\"served_model_name\":\"qwen2.5-1.5b-instruct\",\"engine_image\":\"registry.example/vllm:latest\",\"engine_type\":\"vllm\",\"command\":\"exec vllm serve /models --served-model-name qwen2.5-1.5b-instruct --max-model-len 4096\",\"replicas\":1,\"preset_id\":\"40000000-0000-4000-8000-000000000001\"}}"}
  };
  CreateInferenceData data = 1;
}
message CreateInferenceData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string name = 2;
  string model_version_id = 3 [json_name = "model_version_id"];
  string served_model_name = 4 [json_name = "served_model_name"];
  string engine_image = 5 [json_name = "engine_image"];
  string engine_type = 6 [json_name = "engine_type"];
  string command = 7;
  string cpu = 8 [deprecated = true];
  string memory = 9 [deprecated = true];
  int32 replicas = 10;
  GpuSelection gpu = 11 [deprecated = true];
  inference.view.v1.RuntimeMode runtime_mode = 12 [json_name = "runtime_mode"];
  int32 worker_replicas = 13 [json_name = "worker_replicas"];
  // Required for new managed creates. Legacy resource fields remain reserved input and are rejected.
  string preset_id = 14 [json_name = "preset_id"];
}
message GpuSelection {
  string cluster_id = 1 [json_name = "cluster_id"];
  string pool_id = 2 [json_name = "pool_id"];
  string profile_id = 3 [json_name = "profile_id"];
  uint64 profile_version = 4 [json_name = "profile_version"];
}
message DeleteInferenceRequest { DeleteInferenceData data = 1; }
message DeleteInferenceData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string resource_id = 2 [json_name = "resource_id"];
  int64 expected_generation = 3 [json_name = "expected_generation"];
}
message InferenceAcceptance {
  string operation_id = 1 [json_name = "operation_id"];
  string resource_id = 2 [json_name = "resource_id"];
  bool replayed = 3;
  // Durable Governance admission; this is not model readiness.
  string result = 4;
  string dispatch_operation_id = 5 [json_name = "dispatch_operation_id"];
}
message GetInferenceRequest { string resource_id = 1 [json_name = "resource_id"]; }
message ListInferenceRequest {
  optional int32 page = 1;
  optional int32 page_size = 2 [json_name = "pageSize"];
  string status = 3;
  string capability = 4;
}
// InferenceView is the Governance-owned read projection for UI consumers.
// It intentionally keeps the business-facing flat fields while hiding
// Inference's resource, runtime, engine, artifact and admission internals.
message InferenceView {
  string id = 1;
  string name = 2;
  string desired_state = 3 [json_name = "desired_state"];
  int64 generation = 4;
  string model_version_id = 5 [json_name = "model_version_id"];
  string served_model_name = 6 [json_name = "served_model_name"];
  string phase = 7;
  string health = 8;
  google.protobuf.Timestamp observed_at = 9 [json_name = "observed_at"];
  string engine_image = 10 [json_name = "engine_image"];
  string engine_type = 11 [json_name = "engine_type"];
  string command = 12;
  string cpu = 13;
  string memory = 14;
  int32 replicas = 15;
  inference.view.v1.RuntimeMode runtime_mode = 16 [json_name = "runtime_mode"];
  int32 worker_replicas = 17 [json_name = "worker_replicas"];
  GpuSelection gpu = 18;
  string publication_phase = 19 [json_name = "publication_phase"];
  int64 applied_generation = 20 [json_name = "applied_generation"];
  string preset_id = 21 [json_name = "preset_id"];
  string preset_code = 22 [json_name = "preset_code"];
  int64 cpu_millis = 23 [json_name = "cpu_millis"];
  int64 memory_mib = 24 [json_name = "memory_mib"];
  string selection_digest = 25 [json_name = "selection_digest"];

}
message ListInferenceResponse {
  repeated InferenceView items = 1;
  int64 total = 2;
}
message GetInferenceOperationRequest { string operation_id = 1 [json_name = "operation_id"]; }

// UpdateInferenceRequest is the tenant-facing partial update. Fields named by
// update_mask are forwarded as supplied; Governance never derives or edits an
// engine command.
message UpdateInferenceRequest { UpdateInferenceData data = 1; }
message UpdateInferenceData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string resource_id = 2 [json_name = "resource_id"];
  int64 expected_generation = 3 [json_name = "expected_generation"];
  google.protobuf.FieldMask update_mask = 4 [json_name = "update_mask"];
  string model_version_id = 5 [json_name = "model_version_id"];
  string served_model_name = 6 [json_name = "served_model_name"];
  string engine_image = 7 [json_name = "engine_image"];
  string engine_type = 8 [json_name = "engine_type"];
  string command = 9;
  string cpu = 10 [deprecated = true];
  string memory = 11 [deprecated = true];
  int32 replicas = 12 [deprecated = true];
  GpuSelection gpu = 13 [deprecated = true];
  inference.view.v1.RuntimeMode runtime_mode = 14 [json_name = "runtime_mode"];
  int32 worker_replicas = 15 [json_name = "worker_replicas"];
}

message InferenceServiceCommandRequest { InferenceServiceCommandData data = 1; }
message InferenceServiceCommandData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string resource_id = 2 [json_name = "resource_id"];
  int64 expected_generation = 3 [json_name = "expected_generation"];
}

message ListInferenceOperationsRequest {
  string resource_id = 1 [json_name = "resource_id"];
  optional int32 page = 2;
  optional int32 page_size = 3 [json_name = "pageSize"];
}
message ListInferenceOperationsResponse {
  repeated inference.view.v1.Operation items = 1;
  int64 total = 2;
}
