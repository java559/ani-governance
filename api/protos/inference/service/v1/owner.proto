syntax = "proto3";
package inference.service.v1;

import "inference/v1/inference.proto";
import "google/protobuf/timestamp.proto";
import "gnostic/openapi/v3/annotations.proto";

// Public user intent. Trusted attachments, charges, identity and destination
// are assembled by Governance and have no representation in this DTO.
message CreateInferenceRequest {
  option (gnostic.openapi.v3.schema) = {
    example: {yaml: "{\"data\":{\"idempotency_key\":\"req-001\",\"name\":\"qwen-inference\",\"model_version_id\":\"version-1\",\"served_model_name\":\"qwen2.5-1.5b-instruct\",\"engine_image\":\"registry.example/vllm:latest\",\"engine_type\":\"vllm\",\"command\":\"exec vllm serve /models --served-model-name qwen2.5-1.5b-instruct --max-model-len 4096\",\"cpu\":\"8\",\"memory\":\"32Gi\",\"replicas\":1}}"}
  };
  CreateInferenceData data = 1;
}
message CreateInferenceData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string name = 2;
  string model_version_id = 3 [json_name = "model_version_id"];
  string served_model_name = 4 [json_name = "served_model_name"];
  string engine_image = 5 [json_name = "engine_image"];
  string engine_type = 6 [json_name = "engine_type"];
  string command = 7;
  string cpu = 8;
  string memory = 9;
  int32 replicas = 10;
  GpuSelection gpu = 11;
  inference.v1.RuntimeMode runtime_mode = 12 [json_name = "runtime_mode"];
  int32 worker_replicas = 13 [json_name = "worker_replicas"];
}
message GpuSelection {
  string cluster_id = 1 [json_name = "cluster_id"];
  string pool_id = 2 [json_name = "pool_id"];
  string profile_id = 3 [json_name = "profile_id"];
  uint64 profile_version = 4 [json_name = "profile_version"];
}
message DeleteInferenceRequest { DeleteInferenceData data = 1; }
message DeleteInferenceData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string resource_id = 2 [json_name = "resource_id"];
  int64 expected_generation = 3 [json_name = "expected_generation"];
}
message InferenceAcceptance {
  string operation_id = 1 [json_name = "operation_id"];
  string resource_id = 2 [json_name = "resource_id"];
  bool replayed = 3;
  // Durable Governance admission; this is not model readiness.
  string result = 4;
  string dispatch_operation_id = 5 [json_name = "dispatch_operation_id"];
}
message GetInferenceRequest { string resource_id = 1 [json_name = "resource_id"]; }
message ListInferenceRequest {
  int32 page_size = 1 [json_name = "page_size"];
  string page_token = 2 [json_name = "page_token"];
}
// InferenceView is the Governance-owned read projection for UI consumers.
// It intentionally keeps the business-facing flat fields while hiding
// Inference's resource, runtime, engine, artifact and admission internals.
message InferenceView {
  string id = 1;
  string name = 2;
  string desired_state = 3 [json_name = "desired_state"];
  int64 generation = 4;
  string model_version_id = 5 [json_name = "model_version_id"];
  string served_model_name = 6 [json_name = "served_model_name"];
  string phase = 7;
  string health = 8;
  google.protobuf.Timestamp observed_at = 9 [json_name = "observed_at"];
  string engine_image = 10 [json_name = "engine_image"];
  string engine_type = 11 [json_name = "engine_type"];
  string command = 12;
  string cpu = 13;
  string memory = 14;
  int32 replicas = 15;
  inference.v1.RuntimeMode runtime_mode = 16 [json_name = "runtime_mode"];
  int32 worker_replicas = 17 [json_name = "worker_replicas"];
  GpuSelection gpu = 18;
  string publication_phase = 19 [json_name = "publication_phase"];
  int64 applied_generation = 20 [json_name = "applied_generation"];
}
message ListInferenceResponse {
  repeated InferenceView services = 1;
  string next_page_token = 2 [json_name = "next_page_token"];
}
message GetInferenceOperationRequest { string operation_id = 1 [json_name = "operation_id"]; }
