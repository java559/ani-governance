syntax = "proto3";

package identity.service.v1;

import "gnostic/openapi/v3/annotations.proto";

// 业务功能模块
enum Module {
  MODULE_UNSPECIFIED = 0; // 未指定

  DASHBOARD = 1;        // 仪表盘
  OPM = 2;              // 组织人员管理
  SYSTEM = 3;           // 系统管理
  DICT = 4;             // 数据字典
  TENANT = 5;           // 租户管理
  PERMISSION = 6;       // 权限管理
  LOG = 7;              // 日志审计
  INTERNAL_MESSAGE = 8; // 内部消息
  TASK = 10;            // 任务管理
  NETWORK = 12;         // 网络资源
  MODEL = 11;           // 模型目录
  ACCELERATOR = 13;     // GPU supply and tenant read views
  IMAGE = 14;           // Registered container images and restricted publishing
  INFERENCE = 15;       // User-approved inference create/delete admission
  INSTANCE = 16;        // GPU container instances, separate current action grants
}
