syntax = "proto3";

package identity.service.v1;

import "gnostic/openapi/v3/annotations.proto";

// 业务功能模块
enum Module {
  MODULE_UNSPECIFIED = 0; // 未指定

  DASHBOARD = 1;        // 仪表盘
  OPM = 2;              // 组织人员管理
  SYSTEM = 3;           // 系统管理
  DICT = 4;             // 数据字典
  TENANT = 5;           // 租户管理
  PERMISSION = 6;       // 权限管理
  LOG = 7;              // 日志审计
  INTERNAL_MESSAGE = 8; // 内部消息
  TASK = 10;            // 任务管理
  NETWORK = 12;         // 网络资源
  MODEL = 11;           // 模型仓库：模型与版本资产管理
  ACCELERATOR = 13;     // GPU supply and tenant read views
  IMAGE = 14;           // Registered container images and restricted publishing
  INFERENCE = 15;        // Inference service management
  INSTANCE = 16;        // GPU container instances, separate current action grants
  VIRTUAL_MACHINE = 17; // Virtual machines; feature entitlement, no resource charge
  STORAGE = 18;         // Independent volumes and read-only object browsing
  MODELDEV = 19;        // 模型开发：训练、微调与执行管理
  SANDBOX = 20;         // 沙箱：独立于容器实例的生命周期与套餐资格
}
