syntax = "proto3";

package authentication.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "identity/service/v1/types.proto";

import "authentication/service/v1/ani_auth.proto";

// 用户令牌载体
message UserTokenPayload {
  uint32 user_id = 1 [
    json_name = "uid",
    (gnostic.openapi.v3.property) = {
      description: "用户ID"
    }
  ]; // 用户ID

  optional uint32 tenant_id = 2 [
    json_name = "tid",
    (gnostic.openapi.v3.property) = {
      description: "租户ID"
    }
  ]; // 租户ID

  optional string client_id = 3 [
    json_name = "cid",
    (gnostic.openapi.v3.property) = {
      description: "客户端ID"
    }
  ]; // 客户端ID

  optional string device_id = 4 [
    json_name = "did",
    (gnostic.openapi.v3.property) = {
      description: "设备ID"
    }
  ]; // 设备ID

  optional string username = 5 [
    json_name = "sub",
    (gnostic.openapi.v3.property) = {
      description: "用户名"
    }
  ]; // 用户名

  repeated string roles = 10 [
    json_name = "roc",
    (gnostic.openapi.v3.property) = {
      description: "用户角色码列表"
    }
  ]; // 用户角色码列表

  optional identity.service.v1.DataScope data_scope = 11 [
    json_name = "ds",
    (gnostic.openapi.v3.property) = {
      description: "数据权限范围（旧单值字段，仅为令牌平滑过渡保留）"
    }
  ]; // 数据权限范围（旧单值字段，仅为令牌平滑过渡保留）

  optional uint32 org_unit_id = 12 [
    json_name = "ouid",
    (gnostic.openapi.v3.property) = {
      description: "当前组织单元ID"
    }
  ]; // 当前组织单元ID

  repeated identity.service.v1.DataScope data_scopes = 13 [
    json_name = "dss",
    (gnostic.openapi.v3.property) = {
      description: "数据权限范围类型集合（登录期由多角色配置聚合，ALL 主导，UNIT_* 已并入集合并集）"
    }
  ]; // 数据权限范围类型集合（登录期由多角色配置聚合，ALL 主导，UNIT_* 已并入集合并集）

  repeated uint64 data_scope_unit_ids = 14 [
    json_name = "dsu",
    (gnostic.openapi.v3.property) = {
      description: "UNIT 类数据范围的组织单元目标集（多角色并集，登录期展开）"
    }
  ]; // UNIT 类数据范围的组织单元目标集（多角色并集，登录期展开）

  repeated string hidden_fields = 15 [
    json_name = "hfs",
    (gnostic.openapi.v3.property) = {
      description: "字段权限隐藏字段集（\"资源.字段\" 串，多角色并集，登录期聚合；命中字段读写两侧被剔除）"
    }
  ]; // 字段权限隐藏字段集（"资源.字段" 串，多角色并集，登录期聚合）

  optional bool is_platform_admin = 20 [
    json_name = "ipa",
    (gnostic.openapi.v3.property) = {
      description: "是否平台超级管理员"
    }
  ]; // 是否平台超级管理员

  optional bool is_tenant_admin = 21 [
    json_name = "ita",
    (gnostic.openapi.v3.property) = {
      description: "是否租户管理员"
    }
  ]; // 是否租户管理员

  // 权限码列表（登录期由多角色权限并集聚合）。
  // 用途：服务层的"跨租户能力"判定需要按能力（而非角色码）区分，
  // 例如"重置他人密码"/"替他人重置 MFA"应各自独立授权，
  // 才能支撑平台只读、平台运维等多平台角色。
  // 注意：权限码随定制化增长会推高 JWT 体积，当前请求不区分场景全量携带。
  repeated string permissions = 22 [
    json_name = "pms",
    (gnostic.openapi.v3.property) = {
      description: "权限码列表（多角色并集，登录期聚合）"
    }
  ]; // 权限码列表

  optional string jti = 100 [
    json_name = "jti",
    (gnostic.openapi.v3.property) = {
      description: "令牌唯一标识(JWT ID)"
    }
  ]; // 令牌唯一标识(JWT ID)

  // 应用会话维度（新增 field number，不改变既有 1..100 语义）。
  // application 标识该令牌属于 console 还是 boss 应用会话；是会话隔离的必要声明，
  // 缺失即拒绝，绝不默认归入任一应用。
  optional ApplicationType application = 101 [
    json_name = "app",
    (gnostic.openapi.v3.property) = {
      description: "应用会话标识（console / boss），缺省即拒绝"
    }
  ]; // 应用会话标识

  // 稳定逻辑会话 ID：同一会话刷新后 jti 改变，sid 保持不变。
  // 用于 logout 与 refresh 共享同一原子边界，隔离同应用内的不同逻辑会话。
  optional string sid = 102 [
    json_name = "sid",
    (gnostic.openapi.v3.property) = {
      description: "稳定逻辑会话 ID（刷新后不变）"
    }
  ]; // 稳定逻辑会话 ID

  // 令牌用途：access 或 refresh。缺省或非法值拒绝，避免 AT 被当作 RT 使用。
  optional string token_use = 103 [
    json_name = "tu",
    (gnostic.openapi.v3.property) = {
      description: "令牌用途（access / refresh），缺省或非法值拒绝"
    }
  ]; // 令牌用途
}
