syntax = "proto3";
package admin.service.v1;
import "google/api/annotations.proto";
import "gnostic/openapi/v3/annotations.proto";
import "instance/service/v1/instance.proto";

service InstanceService {
 rpc GetInstanceSchedulingSettings(instance.service.v1.InstanceSchedulingSettingsRequest) returns(instance.service.v1.InstanceSchedulingSettings) { option(google.api.http)={get:"/api/v1/admin/instance-scheduling-settings"}; }
 rpc UpdateInstanceSchedulingSettings(instance.service.v1.UpdateInstanceSchedulingSettingsRequest) returns(instance.service.v1.InstanceSchedulingSettings) { option(google.api.http)={put:"/api/v1/admin/instance-scheduling-settings" body:"*"}; }
 rpc GetSchedulerConfig(instance.service.v1.SchedulerConfigRequest) returns(instance.service.v1.SchedulerConfig) { option(google.api.http)={get:"/api/v1/admin/scheduler-config"}; }
 rpc UpdateSchedulerConfig(instance.service.v1.UpdateSchedulerConfigRequest) returns(instance.service.v1.SchedulerConfig) { option(google.api.http)={put:"/api/v1/admin/scheduler-config" body:"*"}; }
 rpc GetInstanceRuntime(instance.service.v1.GetInstanceRequest) returns(instance.service.v1.InstanceRuntime) { option(google.api.http)={get:"/api/v1/instances/{instance_id}/runtime"}; }
 rpc ListInstanceEvents(instance.service.v1.GetInstanceRequest) returns(instance.service.v1.InstanceEvents) { option(google.api.http)={get:"/api/v1/instances/{instance_id}/events"}; }
 // HTTP is a dedicated SSE handler. OpenAPI is supplied by the source
 // postprocessor rather than representing this stream as a unary JSON reply.
 rpc StreamInstanceLogs(instance.service.v1.InstanceLogsRequest) returns(stream instance.service.v1.InstanceLogFrame);
 rpc AdminListPresets(instance.service.v1.AdminListPresetsRequest) returns(instance.service.v1.AdminListPresetsResponse) { option(google.api.http)={get:"/api/v1/admin/compute-presets"}; }
 rpc AdminGetPreset(instance.service.v1.PresetRequest) returns(instance.service.v1.Preset) { option(google.api.http)={get:"/api/v1/admin/compute-presets/{id}"}; }
 rpc AdminCreatePreset(instance.service.v1.CreatePresetRequest) returns(instance.service.v1.Preset) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "201" value: { response: { description: "Created" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/Preset" } } } }] } } } }] } }; option(google.api.http)={post:"/api/v1/admin/compute-presets" body:"*"}; }
 rpc AdminUpdatePreset(instance.service.v1.UpdatePresetRequest) returns(instance.service.v1.Preset) { option(google.api.http)={patch:"/api/v1/admin/compute-presets/{id}" body:"*"}; }
 rpc AdminSetPresetEnabled(instance.service.v1.SetPresetEnabledRequest) returns(instance.service.v1.Preset) { option(google.api.http)={post:"/api/v1/admin/compute-presets/{id}:set-enabled" body:"*"}; }
 rpc AdminDeletePreset(instance.service.v1.PresetRequest) returns(instance.service.v1.Empty) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "204" value: { response: { description: "Deleted" } } }] } }; option(google.api.http)={delete:"/api/v1/admin/compute-presets/{id}"}; }
 rpc CreateInstance(instance.service.v1.CreateInstanceRequest) returns(instance.service.v1.Acceptance) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "202" value: { response: { description: "Accepted" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/Acceptance" } } } }] } } } }] } }; option(google.api.http)={post:"/api/v1/instances" body:"*"}; }
 rpc ListInstances(instance.service.v1.ListInstancesRequest) returns(instance.service.v1.ListInstancesResponse) { option(google.api.http)={get:"/api/v1/instances"}; }
 rpc GetInstance(instance.service.v1.GetInstanceRequest) returns(instance.service.v1.Instance) { option(google.api.http)={get:"/api/v1/instances/{instance_id}"}; }
 rpc StartInstance(instance.service.v1.ChangeInstanceRequest) returns(instance.service.v1.Acceptance) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "202" value: { response: { description: "Accepted" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/Acceptance" } } } }] } } } }] } }; option(google.api.http)={post:"/api/v1/instances/{data.instance_id}:start" body:"*"}; }
 rpc StopInstance(instance.service.v1.ChangeInstanceRequest) returns(instance.service.v1.Acceptance) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "202" value: { response: { description: "Accepted" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/Acceptance" } } } }] } } } }] } }; option(google.api.http)={post:"/api/v1/instances/{data.instance_id}:stop" body:"*"}; }
 rpc DeleteInstance(instance.service.v1.ChangeInstanceRequest) returns(instance.service.v1.Acceptance) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "202" value: { response: { description: "Accepted" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/Acceptance" } } } }] } } } }] } }; option(google.api.http)={delete:"/api/v1/instances/{data.instance_id}" body:"*"}; }
 rpc GetInstanceOperation(instance.service.v1.GetOperationRequest) returns(instance.service.v1.Operation) { option(google.api.http)={get:"/api/v1/instance-operations/{operation_id}"}; }
 rpc ListInstancePresets(instance.service.v1.ListPresetsRequest) returns(instance.service.v1.ListPresetsResponse) { option(google.api.http)={get:"/api/v1/instance-presets"}; }
 rpc ExecInstance(instance.service.v1.ExecInstanceRequest) returns(instance.service.v1.ExecInstanceResponse) { option (gnostic.openapi.v3.operation) = { responses: { response_or_reference: [{ name: "202" value: { response: { description: "Accepted" content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/ExecInstanceResponse" } } } }] } } } }] } }; option(google.api.http)={post:"/api/v1/instances/{data.instance_id}/exec" body:"*"}; }
}
