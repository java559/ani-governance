syntax = "proto3";
package admin.service.v1;
import "google/api/annotations.proto";
import "catalog/service/v1/accelerator.proto";
import "admin/service/v1/quota_types.proto";
import "google/protobuf/empty.proto";

// Governance requires a JWT platform user and current role permission.
// Accelerator validates the service RPC and its provider-managed cluster scope.
service AcceleratorAdminService {
  rpc GetInitialization(catalog.service.v1.GetAcceleratorInitializationRequest) returns (catalog.service.v1.AcceleratorInitialization) { option (google.api.http) = {get:"/api/v1/admin/accelerator/initialization"}; }
  rpc ListDiscoveredNodes(catalog.service.v1.ListAcceleratorDiscoveredNodesRequest) returns (catalog.service.v1.AcceleratorDiscoveredNodes) { option (google.api.http) = {get:"/api/v1/admin/accelerator/discovered-nodes"}; }
  rpc ListSupplyCandidates(catalog.service.v1.ListAcceleratorSupplyCandidatesRequest) returns (catalog.service.v1.AcceleratorSupplyCandidates) { option (google.api.http) = {get:"/api/v1/admin/accelerator/supply-candidates"}; }
  rpc RegisterSupplyConfiguration(catalog.service.v1.RegisterAcceleratorSupplyConfigurationRequest) returns (catalog.service.v1.AcceleratorSupplyRegistrationResult) { option (google.api.http) = {post:"/api/v1/admin/accelerator/supply-registrations" body:"*"}; }
  rpc GetSupplyRegistration(catalog.service.v1.GetAcceleratorSupplyRegistrationRequest) returns (catalog.service.v1.AcceleratorSupplyRegistrationResult) { option (google.api.http) = {get:"/api/v1/admin/accelerator/supply-registrations/{registration_id}"}; }
  rpc GetSupplyConfiguration(catalog.service.v1.GetAcceleratorSupplyConfigurationRequest) returns (catalog.service.v1.AcceleratorRegisteredSupplyConfiguration) { option (google.api.http) = {get:"/api/v1/admin/accelerator/supply-configurations"}; }
  rpc PreviewSupplyGroupPolicy(catalog.service.v1.PreviewAcceleratorSupplyGroupPolicyRequest) returns (catalog.service.v1.AcceleratorSupplyGroupPolicyPreview) { option (google.api.http) = {post:"/api/v1/admin/accelerator/supply-groups:preview-policy" body:"*"}; }
  rpc CreateInitialization(catalog.service.v1.CreateAcceleratorInitializationRequest) returns (catalog.service.v1.AcceleratorInitializationOperation) { option (google.api.http) = {post:"/api/v1/admin/accelerator/initializations" body:"*"}; }
  rpc GetInitializationOperation(catalog.service.v1.GetAcceleratorInitializationOperationRequest) returns (catalog.service.v1.AcceleratorInitializationOperation) { option (google.api.http) = {get:"/api/v1/admin/accelerator/initializations/{operation_id}"}; }
  rpc RetryInitializationOperation(catalog.service.v1.RetryAcceleratorInitializationOperationRequest) returns (catalog.service.v1.AcceleratorInitializationOperation) { option (google.api.http) = {post:"/api/v1/admin/accelerator/initializations/{operation_id}:retry" body:"*"}; }
  rpc ListClusters(catalog.service.v1.AcceleratorPageRequest) returns (catalog.service.v1.AcceleratorClusters) { option (google.api.http) = {get:"/api/v1/admin/accelerator/clusters"}; }
  rpc RegisterCluster(catalog.service.v1.RegisterAcceleratorClusterRequest) returns (catalog.service.v1.AcceleratorCluster) { option (google.api.http) = {post:"/api/v1/admin/accelerator/clusters" body:"*"}; }
  rpc ListPools(catalog.service.v1.AcceleratorPageRequest) returns (catalog.service.v1.AcceleratorPools) { option (google.api.http) = {get:"/api/v1/admin/accelerator/pools"}; }
  rpc CreatePool(catalog.service.v1.CreateAcceleratorPoolRequest) returns (catalog.service.v1.AcceleratorPool) { option (google.api.http) = {post:"/api/v1/admin/accelerator/pools" body:"*"}; }
  rpc ListSupplyGroups(catalog.service.v1.AcceleratorPageRequest) returns (catalog.service.v1.AcceleratorSupplies) { option (google.api.http) = {get:"/api/v1/admin/accelerator/supply-groups"}; }
  rpc AdoptSupplyGroup(catalog.service.v1.AdoptAcceleratorSupplyRequest) returns (catalog.service.v1.AcceleratorSupply) { option (google.api.http) = {post:"/api/v1/admin/accelerator/supply-groups:adopt" body:"*"}; }
  rpc SetAdmission(catalog.service.v1.SetAcceleratorAdmissionRequest) returns (catalog.service.v1.AcceleratorSupply) { option (google.api.http) = {post:"/api/v1/admin/accelerator/supply-groups/{group_id}:set-admission" body:"*"}; }
  rpc AdminListProfiles(catalog.service.v1.AcceleratorPageRequest) returns (catalog.service.v1.AcceleratorProfiles) { option (google.api.http) = {get:"/api/v1/admin/accelerator/profiles"}; }
  rpc CreateProfile(catalog.service.v1.CreateAcceleratorProfileRequest) returns (catalog.service.v1.AcceleratorProfile) { option (google.api.http) = {post:"/api/v1/admin/accelerator/profiles" body:"*"}; }
  rpc PreviewProfile(catalog.service.v1.PreviewAcceleratorProfileRequest) returns (catalog.service.v1.AcceleratorProfilePreview) { option (google.api.http) = {get:"/api/v1/admin/accelerator/profiles:preview"}; }
  rpc SetProfileState(catalog.service.v1.SetAcceleratorProfileStateRequest) returns (catalog.service.v1.AcceleratorProfile) { option (google.api.http) = {post:"/api/v1/admin/accelerator/profiles/{profile_id}:set-state" body:"*"}; }
  rpc DeleteProfile(catalog.service.v1.DeleteAcceleratorProfileRequest) returns (catalog.service.v1.AcceleratorProfile) { option (google.api.http) = {post:"/api/v1/admin/accelerator/profiles/{profile_id}:delete" body:"*"}; }
  rpc ListDevices(catalog.service.v1.AcceleratorPageRequest) returns (catalog.service.v1.AcceleratorDevices) { option (google.api.http) = {get:"/api/v1/admin/accelerator/devices"}; }
}
// Governance requires a JWT tenant user, active tenant, ACCELERATOR plan module
// and current role permission. Accelerator enforces trusted tenant isolation.
service AcceleratorService {
  rpc ListProfiles(catalog.service.v1.AcceleratorTenantPageRequest) returns (catalog.service.v1.AcceleratorProfiles) { option (google.api.http) = {get:"/api/v1/accelerator/profiles"}; }
  rpc GetProfile(catalog.service.v1.AcceleratorTenantVersionRequest) returns (catalog.service.v1.AcceleratorProfile) { option (google.api.http) = {get:"/api/v1/accelerator/profiles/{profile_id}"}; }
}
service QuotaSelfService {
  rpc GetMyQuotaAccounts(google.protobuf.Empty) returns (ListTenantQuotaAccountsResponse) { option (google.api.http) = {get:"/api/v1/me/quota-accounts"}; }
}

// Custom HTTP registration preserves optional integer presence as explicit null.
service AcceleratorCapacityAdminService {
  rpc GetProfileCapacity(catalog.service.v1.GetAcceleratorProfileCapacityRequest) returns (catalog.service.v1.AcceleratorProfileCapacity) { option (google.api.http) = {get:"/api/v1/admin/accelerator/profiles/{profile_id}/capacity"}; }
  rpc GetSupplyGroupCapacity(catalog.service.v1.GetAcceleratorSupplyGroupCapacityRequest) returns (catalog.service.v1.AcceleratorSupplyGroupCapacity) { option (google.api.http) = {get:"/api/v1/admin/accelerator/supply-groups/{group_id}/capacity"}; }
}
