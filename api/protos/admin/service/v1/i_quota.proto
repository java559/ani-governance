syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";

import "pagination/v1/pagination.proto";
import public "admin/service/v1/quota_types.proto";

// 配额目录与租户账户读取服务（QUOTA-01/02）。
// 仅平台管理权限；读取沿用现有分页与成功 JSON 风格，不加全局 code/data envelope。
service QuotaAdminService {
  // 查询配额目录（QUOTA-01）
  rpc ListQuotaDefinitions (pagination.PagingRequest) returns (ListQuotaDefinitionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/quota-definitions"
    };
  }

  // 查询指定租户配额账户（QUOTA-02）
  rpc ListTenantQuotaAccounts (GetTenantQuotaAccountsRequest) returns (ListTenantQuotaAccountsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/tenants/{id}/quota-accounts"
    };
  }
}
