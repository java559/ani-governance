syntax = "proto3";
package access_key.service.v1;
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

service AccessKeyService {
  rpc List (pagination.PagingRequest) returns (ListAccessKeyResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountAccessKeyResponse) {}
  rpc Get (GetAccessKeyRequest) returns (AccessKey) {}
  rpc Create (CreateAccessKeyRequest) returns (CreateAccessKeyResponse) {}
  rpc Update (UpdateAccessKeyRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteAccessKeyRequest) returns (DeleteAccessKeyResponse) {}
  rpc ResetSecret (ResetAccessKeySecretRequest) returns (CreateAccessKeyResponse) {}
}

// Public metadata only. Secret material is deliberately absent.
message AccessKey {
  optional uint32 id = 1;
  optional string name = 2;
  optional string access_key = 3 [json_name = "access_key"];
  optional bool is_active = 4 [json_name = "is_active"];
  optional google.protobuf.Timestamp expires_at = 5 [json_name = "expires_at"];
  optional google.protobuf.Timestamp last_used_at = 6 [json_name = "last_used_at"];
  optional uint32 role_id = 7 [json_name = "role_id"];
  // 绑定角色名称/描述：只读，服务端按 role_id 在请求租户内回填。
  // 角色不存在或被删除时字段缺席（不下发空串），前端需容忍可选字段。
  optional string role_name = 8 [
    json_name = "role_name",
    (gnostic.openapi.v3.property) = {description: "绑定角色名称（只读，服务端回填）", read_only: true}
  ];
  optional string role_description = 9 [
    json_name = "role_description",
    (gnostic.openapi.v3.property) = {description: "绑定角色描述（只读，服务端回填）", read_only: true}
  ];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "created_at"];
}
message ListAccessKeyResponse {
  repeated AccessKey items = 1;
  uint64 total = 2;
  // 游标分页的下一页游标；末页为空字符串。仅在 limit+cursor 分页下返回。
  string next_cursor = 3 [json_name = "next_cursor"];
}
message CountAccessKeyResponse { uint64 count = 1; }
message GetAccessKeyRequest { uint32 key_id = 1 [json_name = "key_id"]; }
// Create-only input. It stays separate from the read model (AccessKey) so the
// idempotency key never leaks into GET/List responses or the OpenAPI read schema.
//
// 字段编号刻意沿用旧 CreateAccessKeyRequest.data（原 AccessKey）的编号：
// 旧定义里 name=2、expires_at=5、role_id=7，若改编号会让仍用旧 Proto 的 gRPC
// 客户端发来的 name/role_id/expires_at 无法解码。旧 AccessKey 在两处共用的
// 编号（1/3/4/6/200）在本输入里不再使用，用 reserved 标注防止被复用作新字段。
message CreateAccessKeyData {
  reserved 1, 3, 4, 6, 200;
  reserved "id", "access_key", "is_active", "last_used_at", "created_at";

  optional string name = 2;
  optional google.protobuf.Timestamp expires_at = 5 [json_name = "expires_at"];
  optional uint32 role_id = 7 [json_name = "role_id"];
  // Optional. When present, retrying with the same value and the same intent
  // replays the original key instead of creating a second one; a different
  // intent under the same value is rejected with 409 IDEMPOTENCY_CONFLICT.
  // 使用全新的未占用编号，不与旧字段冲突。
  optional string idempotency_key = 8 [json_name = "idempotency_key"];
}
message CreateAccessKeyRequest { CreateAccessKeyData data = 1; }
message UpdateAccessKeyRequest {
  uint32 key_id = 1 [json_name = "key_id"];
  AccessKey data = 2;
  // FieldMask JSON values use lowerCamel paths, e.g. roleId,isActive,expiresAt.
  google.protobuf.FieldMask update_mask = 3 [json_name = "update_mask", (gnostic.openapi.v3.property) = { type: "string" description: "Comma-separated lowerCamel paths, e.g. roleId,isActive,expiresAt" }];
}
message DeleteAccessKeyRequest { uint32 key_id = 1 [json_name = "key_id"]; }
message DeleteAccessKeyResponse { string status = 1; }
message CreateAccessKeyResponse {
  AccessKey data = 1;
  // Returned once on creation/reset; encrypted at rest.
  string secret_key = 2 [json_name = "secret_key"];
}
message ResetAccessKeySecretRequest { uint32 key_id = 1 [json_name = "key_id"]; }
