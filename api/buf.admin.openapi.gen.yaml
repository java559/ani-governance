version: v2

clean: false

managed:
  enabled: true

  disable:
    - module: buf.build/googleapis/googleapis
    - module: 'buf.build/envoyproxy/protoc-gen-validate'
    - module: 'buf.build/kratos/apis'
    - module: 'buf.build/gnostic/gnostic'
    - module: 'buf.build/gogo/protobuf'

  override:
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go

    # 本地化分页 Proto（api/localdeps/pagination，源码与 go-crud/api@v0.0.7 逐字节一致）。
    # managed 全局前缀 go-wind-admin/api/gen/go 对此 Proto 例外：生成到 pkg/localdeps 目标，
    # Go 包名保持上游生成物的 v1（原 option go_package 的 ;pagination 别名在上游生成物中
    # 已被 go_package_prefix 抹去，这里复刻既有行为，不改变协议）。
    - file_option: go_package
      path: pagination/v1
      value: go-wind-admin/pkg/localdeps/go-crud/api/gen/go/pagination/v1

    # 本地化脱敏 Proto（api/localdeps/redact，与 protoc-gen-go-redact 锁定归档逐字节一致）。
    # 这一条取代原先 managed.disable 里的外部模块 buf.build/go-wind/redact：接管后 redact 的
    # go_package 必须与生成器 imports.go 标准 import 表里的本地运行时路径逐字符相等，
    # Module.importPaths 才会把这个 import 认作脱敏运行时本身并沿用别名 redact，
    # 生成的 .pb.redact.go 才引用得到符号。;redact 包名别名保持归档生成物一致，协议内容不变。
    - file_option: go_package
      path: redact/v1
      value: go-wind-admin/pkg/localdeps/go-wind-toolkit/protoc-gen-go-redact/redact/v1;redact
inputs:
  - directory: protos
    paths:
      - protos/admin/service/v1

plugins:
  # generate openapi v2 json doc
  #  - local: [go, run, github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1]v2
  #    out: ../app/admin/service/cmd/server/assets
  #    opt:
  #      - json_names_for_fields=true
  #      - logtostderr=true

  # generate openapi v3 yaml doc
  - local: [go, run, github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1]
    out: ../app/admin/service/cmd/server/assets
    opt:
      - naming=json # 命名约定。使用"proto"则直接从proto文件传递名称。默认为：json
      - depth=2 # 循环消息的递归深度，默认为：2
      - default_response=false # 添加默认响应消息。如果为“true”，则自动为使用google.rpc.Status消息的操作添加默认响应。如果您使用envoy或grpc-gateway进行转码，则非常有用，因为它们使用此类型作为默认错误响应。默认为：true。
      - enum_type=string # 枚举类型的序列化的类型。使用"string"则进行基于字符串的序列化。默认为：integer。
      - output_mode=merged # 输出文件生成模式。默认情况下，只有一个openapi.yaml文件会生成在输出文件夹。使用“source_relative”则会为每一个'[inputfile].proto'文件单独生成一个“[inputfile].openapi.yaml”文件。默认为：merged。
      - fq_schema_naming=false # Schema的命名是否加上包名，为true，则会加上包名，例如：system.service.v1.ListDictDetailResponse，否则为：ListDictDetailResponse。默认为：false。
