apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: governance-client
spec:
  secretName: governance-client-tls
  issuerRef:
    name: ani-internal-ca
    kind: Issuer
  dnsNames:
    - ani-governance
  usages:
    - digital signature
    - client auth
  # 10 years. The consuming process loads this key pair once at startup and
  # never reloads it, so a short rotation window silently breaks mTLS.
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
