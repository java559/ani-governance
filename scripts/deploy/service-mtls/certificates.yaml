# Internal mTLS identities. Use the existing platform ClusterIssuer; never create a second root.
# VM session URI identities are an explicit existing contract, isolated from DNS clients.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ani-governance-client-tls
  namespace: ani-system
  labels:
    app.kubernetes.io/part-of: ani
spec:
  secretName: ani-governance-client-tls
  dnsNames:
    - ani-governance
  usages:
    - digital signature
    - client auth
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: ani-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
