apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-resource-service
  namespace: ani-system
spec:
  template:
    metadata:
      annotations:
        ani.io/service-mtls: cert-manager
    spec:
      volumes:
      - name: input
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: ani-resource-private
              items:
              - key: compute.json
                path: compute.json
              - key: config.yaml
                path: config.yaml
              - key: harbor-ca.crt
                path: harbor-ca.crt
              - key: harbor.password
                path: harbor.password
              - key: image-cursor.key
                path: image-cursor.key
              - key: image-keyring.json
                path: image-keyring.json
              - key: image-runtime.dsn
                path: image-runtime.dsn
              - key: instance.json
                path: instance.json
              - key: owner.key
                path: owner.key
              - key: runtime.dsn
                path: runtime.dsn
          - configMap:
              name: ani-internal-service-ca
              items:
              - key: ca.crt
                path: ca.crt
          - secret:
              name: ani-resource-client-tls
              items:
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
          - secret:
              name: ani-resource-server-tls
              items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
        secret: null
        configMap: null
      - name: vm-client-ca-input
        projected:
          defaultMode: 288
          sources:
          - configMap:
              name: ani-internal-service-ca
              items:
              - key: ca.crt
                path: client-ca.crt
        secret: null
        configMap: null
      - name: image-runtime-tls
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: ani-resource-server-tls
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
          - configMap:
              name: ani-internal-service-ca
              items:
              - key: ca.crt
                path: ca.crt
        secret: null
        configMap: null
---
