apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ani-node-agent
  namespace: ani-system
spec:
  template:
    metadata:
      annotations:
        ani.io/service-mtls: cert-manager
    spec:
      volumes:
      - name: identity
        projected:
          defaultMode: 256
          sources:
          - serviceAccountToken:
              audience: ani-node-agent
              expirationSeconds: 600
              path: token
        secret: null
        configMap: null
      - name: tls
        projected:
          defaultMode: 256
          sources:
          - secret:
              name: ani-node-agent-client-tls
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
          - configMap:
              name: ani-internal-service-ca
              items:
              - key: ca.crt
                path: ca.crt
        secret: null
        configMap: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-session-gateway
  namespace: ani-system
spec:
  template:
    metadata:
      annotations:
        ani.io/service-mtls: cert-manager
    spec:
      volumes:
      - name: vm-mtls
        projected:
          defaultMode: 288
          sources:
          - secret:
              name: ani-session-gateway-server-tls
              items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
          - configMap:
              name: ani-internal-service-ca
              items:
              - key: ca.crt
                path: ca.crt
          - configMap:
              name: ani-internal-service-ca
              items:
              - key: ca.crt
                path: resource-ca.crt
          - secret:
              name: ani-session-gateway-client-tls
              items:
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
        secret: null
        configMap: null
      containers:
      - name: session-gateway
        env:
        - name: RESOURCE_INSTANCE_CERT_FILE
          value: /var/run/secrets/ani-vm/client.crt
        - name: RESOURCE_INSTANCE_KEY_FILE
          value: /var/run/secrets/ani-vm/client.key
---
